<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Área do Cliente - DANIEL RB MOTOS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #2b2b2b;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 30px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    color: #ccc;
}

.container {
    max-width: 450px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-top: 40px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.erro {
    display: none;
    color: #b00000;
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
}

.voltar {
    display: block;
    text-align: center;
    color: white;
    text-decoration: none;
    margin-top: 20px;
}

</style>

</head>

<body>

<header>

<h1>
🏍️ DANIEL RB MOTOS
</h1>

<p>
Área do Cliente
</p>

</header>


<div class="container">

<div class="card">

<h2>
👤 Identificar cliente
</h2>

<p>
Digite o telefone cadastrado na oficina para acessar suas informações.
</p>


<label>
Telefone
</label>

<input
type="tel"
id="telefone"
placeholder="(00) 00000-0000"
onkeydown="verificarEnter(event)"
>


<button
type="button"
onclick="entrarCliente()"
>

🏍️ Continuar

</button>


<div
id="erro"
class="erro"
>

❌ Telefone não encontrado.

</div>

</div>


<a
href="index.html"
class="voltar"
>

← Voltar para o início

</a>

</div>


<script>

function carregarClientes() {

    return JSON.parse(
        localStorage.getItem("clientes")
    ) || [];

}


function limparTelefone(numero) {

    return String(numero || "")
        .replace(/\D/g, "");

}


function entrarCliente() {

    const telefoneDigitado =
        limparTelefone(
            document.getElementById("telefone").value
        );


    const clientes =
        carregarClientes();


    const cliente =
        clientes.find(
            function(item) {

                const telefone =
                    limparTelefone(item.telefone);

                const whatsapp =
                    limparTelefone(item.whatsapp);

                return (
                    telefone === telefoneDigitado ||
                    whatsapp === telefoneDigitado
                );

            }
        );


    if (!cliente) {

        document.getElementById(
            "erro"
        ).style.display = "block";

        document.getElementById(
            "telefone"
        ).focus();

        return;

    }


    sessionStorage.setItem(
        "clienteLogado",
        String(cliente.id)
    );


    window.location.href =
        "cliente.html";

}


function verificarEnter(event) {

    if (event.key === "Enter") {

        entrarCliente();

    }

}

</script>

</body>

</html>
