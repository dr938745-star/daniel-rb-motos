<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - DANIEL RB MOTOS</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
        }

        header {
            background: #111;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
        }

        main {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        .cadastro-box {
            background: #111;
            border-radius: 16px;
            padding: 25px 20px;
            margin-top: 10px;
            border: 1px solid #333;
        }

        .cadastro-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 23px;
        }

        .descricao {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: white;
        }

        input::placeholder {
            color: #888;
        }

        .botao {
            display: block;
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: .2s;
        }

        .botao:hover {
            background: #ddd;
            transform: scale(1.01);
        }

        .botao:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .erro {
            display: block;
            background: #3a1717;
            border: 1px solid #6b2929;
            color: #ffb3b3;
        }

        .sucesso {
            display: block;
            background: #173a20;
            border: 1px solid #296b39;
            color: #b3ffc2;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #aaa;
            font-size: 14px;
        }

        .login a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar:hover {
            color: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #aaa;
            font-size: 13px;
        }

        .instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 25px;
            background: #111;
            color: white !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #444;
            transition: .2s;
        }

        .instagram:hover {
            background: #333;
            transform: scale(1.03);
        }

    </style>

</head>


<body>


<header>

    <h1>🏍️ DANIEL RB MOTOS</h1>

    <p>Área do Cliente</p>

</header>


<main>

    <div class="cadastro-box">

        <h2>📝 Criar minha conta</h2>

        <div class="descricao">

            Crie sua conta gratuitamente para acessar
            suas motos, solicitar serviços e acompanhar
            seus atendimentos.

        </div>


        <form id="cadastroForm">


            <!-- NOME -->

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                autocomplete="name"
                required
            >


            <!-- CPF -->

            <label for="cpf">
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                inputmode="numeric"
                autocomplete="off"
                required
            >


            <!-- WHATSAPP -->

            <label for="whatsapp">
                WhatsApp
            </label>

            <input
                type="tel"
                id="whatsapp"
                placeholder="(00) 00000-0000"
                maxlength="15"
                inputmode="tel"
                autocomplete="tel"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >


            <!-- SENHA -->

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Mínimo de 6 caracteres"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <!-- CONFIRMAR SENHA -->

            <label for="confirmarSenha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="botao"
                id="botaoCadastro">

                📝 Criar minha conta

            </button>


        </form>


        <div
            id="mensagem"
            class="mensagem">
        </div>


        <div class="login">

            Já possui uma conta?

            <br>

            <a href="login.html">
                🔑 Entrar na minha conta
            </a>

        </div>


        <a
            href="index.html"
            class="voltar">

            ← Voltar para o início

        </a>

    </div>

</main>


<footer>

    DANIEL RB MOTOS
    <br>

    Oficina de motos
    <br>

    <a
        class="instagram"
        href="https://www.instagram.com/danielrbmotoss/"
        target="_blank"
        rel="noopener noreferrer">

        📸 @DANIELRBMOTOSS

    </a>

</footer>


<script>


/* =====================================================
   CONFIGURAÇÃO DO SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTOS
   ===================================================== */

const cadastroForm =
    document.getElementById("cadastroForm");

const botaoCadastro =
    document.getElementById("botaoCadastro");

const mensagem =
    document.getElementById("mensagem");


/* =====================================================
   MOSTRAR MENSAGEM
   ===================================================== */

function mostrarMensagem(texto, tipo) {

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

}


/* =====================================================
   FORMATAR CPF
   ===================================================== */

document
    .getElementById("cpf")
    .addEventListener("input", function () {

        let valor =
            this.value.replace(/\D/g, "");

        valor =
            valor.substring(0, 11);

        if (valor.length > 9) {

            valor =
                valor.replace(
                    /(\d{3})(\d{3})(\d{3})(\d{1,2})/,
                    "$1.$2.$3-$4"
                );

        } else if (valor.length > 6) {

            valor =
                valor.replace(
                    /(\d{3})(\d{3})(\d{1,3})/,
                    "$1.$2.$3"
                );

        } else if (valor.length > 3) {

            valor =
                valor.replace(
                    /(\d{3})(\d{1,3})/,
                    "$1.$2"
                );

        }

        this.value = valor;

    });


/* =====================================================
   FORMATAR WHATSAPP
   ===================================================== */

document
    .getElementById("whatsapp")
    .addEventListener("input", function () {

        let valor =
            this.value.replace(/\D/g, "");

        valor =
            valor.substring(0, 11);


        if (valor.length > 10) {

            valor =
                valor.replace(
                    /(\d{2})(\d{5})(\d{1,4})/,
                    "($1) $2-$3"
                );

        } else if (valor.length > 6) {

            valor =
                valor.replace(
                    /(\d{2})(\d{4})(\d{1,4})/,
                    "($1) $2-$3"
                );

        } else if (valor.length > 2) {

            valor =
                valor.replace(
                    /(\d{2})(\d{1,5})/,
                    "($1) $2"
                );

        }

        this.value = valor;

    });


/* =====================================================
   CADASTRO
   ===================================================== */

cadastroForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* PEGAR DADOS */

        const nome =
            document
                .getElementById("nome")
                .value
                .trim();

        const cpf =
            document
                .getElementById("cpf")
                .value
                .trim();

        const whatsapp =
            document
                .getElementById("whatsapp")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const senha =
            document
                .getElementById("senha")
                .value;

        const confirmarSenha =
            document
                .getElementById("confirmarSenha")
                .value;


        /* LIMPAR MENSAGEM */

        mensagem.className =
            "mensagem";

        mensagem.textContent = "";


        /* VALIDAR NOME */

        if (nome.length < 3) {

            mostrarMensagem(
                "❌ Digite seu nome completo.",
                "erro"
            );

            return;

        }


        /* VALIDAR CPF */

        const cpfNumeros =
            cpf.replace(/\D/g, "");

        if (cpfNumeros.length !== 11) {

            mostrarMensagem(
                "❌ Digite um CPF válido com 11 números.",
                "erro"
            );

            return;

        }


        /* VALIDAR WHATSAPP */

        const whatsappNumeros =
            whatsapp.replace(/\D/g, "");

        if (
            whatsappNumeros.length !== 10 &&
            whatsappNumeros.length !== 11
        ) {

            mostrarMensagem(
                "❌ Digite um WhatsApp válido.",
                "erro"
            );

            return;

        }


        /* VALIDAR SENHA */

        if (senha.length < 6) {

            mostrarMensagem(
                "❌ A senha precisa ter pelo menos 6 caracteres.",
                "erro"
            );

            return;

        }


        /* CONFIRMAR SENHA */

        if (senha !== confirmarSenha) {

            mostrarMensagem(
                "❌ As senhas não são iguais.",
                "erro"
            );

            return;

        }


        /* DESABILITAR BOTÃO */

        botaoCadastro.disabled = true;

        botaoCadastro.textContent =
            "⏳ Criando sua conta...";


        try {


            /* =================================================
               CRIAR USUÁRIO NO SUPABASE AUTH
               ================================================= */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: senha,

                    options: {

                        data: {

                            nome: nome,

                            cpf: cpfNumeros,

                            whatsapp: whatsappNumeros

                        }

                    }

                });


            /* =================================================
               ERRO
               ================================================= */

            if (error) {

                console.error(
                    "Erro no cadastro:",
                    error
                );


                let mensagemErro =
                    "❌ Não foi possível criar a conta.";


                if (
                    error.message
                        .toLowerCase()
                        .includes("already registered")
                ) {

                    mensagemErro =
                        "❌ Este e-mail já possui uma conta.";

                }


                if (
                    error.message
                        .toLowerCase()
                        .includes("password")
                ) {

                    mensagemErro =
                        "❌ A senha não atende aos requisitos.";

                }


                mostrarMensagem(
                    mensagemErro,
                    "erro"
                );


                botaoCadastro.disabled = false;

                botaoCadastro.textContent =
                    "📝 Criar minha conta";

                return;

            }


            /* =================================================
               CONTA CRIADA
               ================================================= */

            console.log(
                "Usuário criado:",
                data.user
            );


            /* =================================================
               SE O SUPABASE JÁ DEU UMA SESSÃO,
               ENTRA AUTOMATICAMENTE
               ================================================= */

            if (data.session) {


                mostrarMensagem(
                    "✅ Conta criada com sucesso! Entrando...",
                    "sucesso"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "minhas-motos.html";

                    },
                    1000
                );


            } else {


                /*
                 * Se a confirmação de e-mail estiver ativada
                 * no Supabase, a sessão pode ficar vazia.
                 */

                mostrarMensagem(
                    "✅ Conta criada! Verifique seu e-mail para confirmar a conta e depois entre no sistema.",
                    "sucesso"
                );


                botaoCadastro.disabled = false;

                botaoCadastro.textContent =
                    "📝 Criar minha conta";

            }


        } catch (erro) {


            console.error(
                "Erro inesperado:",
                erro
            );


            mostrarMensagem(
                "❌ Ocorreu um erro inesperado. Tente novamente.",
                "erro"
            );


            botaoCadastro.disabled = false;

            botaoCadastro.textContent =
                "📝 Criar minha conta";

        }

    }
);

</script>


</body>

</html>
