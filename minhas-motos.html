<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minhas Motos - DANIEL RB MOTOS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: white;
    min-height: 100vh;
}

header {
    background: #050505;
    border-bottom: 1px solid #222;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
    color: #aaa;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
}

.card h2 {
    margin-top: 0;
}

.info-cliente {
    background: #202020;
    border: 1px solid #333;
    padding: 14px;
    border-radius: 12px;
    color: #ddd;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 16px;
    background: #0f0f0f;
    color: white;
    outline: none;
}

input:focus {
    border-color: #d40000;
}

.botao {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #e00000, #870000);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
}

.botao:hover {
    opacity: 0.92;
}

.moto {
    border: 1px solid #333;
    background: #1d1d1d;
    border-radius: 14px;
    padding: 18px;
    margin-top: 15px;
}

.moto h3 {
    margin-top: 0;
    font-size: 20px;
}

.moto p {
    color: #ccc;
    line-height: 1.5;
}

.vazio {
    color: #999;
    text-align: center;
    padding: 20px;
}

.mensagem {
    padding: 14px;
    border-radius: 10px;
    margin-top: 12px;
    font-weight: bold;
}

.erro {
    background: #3a1010;
    color: #ff7777;
    border: 1px solid #6b2222;
}

.sucesso {
    background: #10351d;
    color: #65df8a;
    border: 1px solid #1f6d38;
}

.voltar {
    display: block;
    width: 100%;
    text-align: center;
    color: white;
    text-decoration: none;
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    margin-top: 20px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
}

.voltar:hover {
    background: #222;
}

footer {
    text-align: center;
    padding: 30px 20px;
    color: #777;
    font-size: 13px;
}

.instagram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 25px;
    background: #151515;
    color: white;
    text-decoration: none;
    border: 1px solid #333;
}

</style>

</head>

<body>

<header>

<h1>🏍️ Minhas Motos</h1>

<p>DANIEL RB MOTOS</p>

</header>

<div class="container">

<div class="card">

<h2>👤 Minha conta</h2>

<div
id="nomeCliente"
class="info-cliente"
>
⏳ Carregando seus dados...
</div>

</div>


<div class="card">

<h2>🏍️ Minhas motos</h2>

<div id="listaMotos">

<div class="vazio">
⏳ Carregando suas motos...
</div>

</div>

</div>


<div class="card">

<h2>➕ Cadastrar minha moto</h2>

<p style="color:#aaa;line-height:1.5;">
Cadastre uma moto que pertence a você.
</p>

<label for="marca">
Marca
</label>

<input
type="text"
id="marca"
placeholder="Ex: Honda"
>

<label for="modelo">
Modelo
</label>

<input
type="text"
id="modelo"
placeholder="Ex: Bros 160"
>

<label for="ano">
Ano
</label>

<input
type="text"
id="ano"
placeholder="Ex: 2020"
>

<label for="placa">
Placa
</label>

<input
type="text"
id="placa"
placeholder="ABC1D23"
>

<label for="km">
Quilometragem
</label>

<input
type="text"
id="km"
placeholder="Ex: 35000"
>

<button
type="button"
class="botao"
id="botaoCadastrar"
>
💾 Cadastrar minha moto
</button>

<div id="mensagem"></div>

</div>


<a
href="area-cliente.html"
class="voltar"
>
← Voltar para a Área do Cliente
</a>

</div>


<footer>

DANIEL RB MOTOS<br>
Oficina de motos

<br>

<a
class="instagram"
href="https://www.instagram.com/danielrbmotoss/"
target="_blank"
rel="noopener noreferrer"
>
📸 @DANIELRBMOTOSS
</a>

</footer>


<script>

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let usuarioLogado = null;
let clienteLogado = null;


async function iniciar() {

    try {

        const {
            data: {
                user
            },
            error: erroUsuario
        } = await supabaseClient
            .auth
            .getUser();


        if (erroUsuario) {
            throw erroUsuario;
        }


        if (!user) {

            window.location.href =
                "login-cliente.html";

            return;

        }


        usuarioLogado = user;


        const email =
            user.email
            ? user.email
                .trim()
                .toLowerCase()
            : "";


        if (!email) {

            mostrarErro(
                "A conta não possui um e-mail válido."
            );

            return;

        }


        const {
            data: cliente,
            error: erroCliente
        } = await supabaseClient
            .from("clientes_nova")
            .select("id,nome,email")
            .eq("email", email)
            .maybeSingle();


        if (erroCliente) {

            throw erroCliente;

        }


        if (!cliente) {

            mostrarErro(
                "Seu cadastro de cliente não foi encontrado."
            );

            return;

        }


        clienteLogado = cliente;


        document.getElementById(
            "nomeCliente"
        ).innerHTML =
            "👤 <strong>" +
            escaparHTML(cliente.nome || "Cliente") +
            "</strong>";


        await carregarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO INICIAR:",
            erro
        );

        mostrarErro(
            erro.message ||
            "Não foi possível carregar sua conta."
        );

    }

}


async function carregarMotos() {

    const lista =
        document.getElementById(
            "listaMotos"
        );


    if (!clienteLogado) {

        return;

    }


    lista.innerHTML = `
        <div class="vazio">
            ⏳ Carregando suas motos...
        </div>
    `;


    const {
        data: motos,
        error
    } = await supabaseClient
        .from("motos")
        .select(
            "id,marca,modelo,placa,ano,km,created_at"
        )
        .eq(
            "cliente_id",
            Number(clienteLogado.id)
        )
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "ERRO AO CARREGAR MOTOS:",
            error
        );

        lista.innerHTML = `
            <div class="mensagem erro">
                ❌ Não foi possível carregar suas motos.
                <br><br>
                ${escaparHTML(error.message)}
            </div>
        `;

        return;

    }


    if (!motos || motos.length === 0) {

        lista.innerHTML = `
            <div class="vazio">
                🏍️ Você ainda não possui motos cadastradas.
            </div>
        `;

        return;

    }


    lista.innerHTML = "";


    motos.forEach(
        function(moto) {

            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "moto";


            bloco.innerHTML = `

                <h3>
                    🏍️
                    ${escaparHTML(
                        moto.marca || ""
                    )}
                    ${escaparHTML(
                        moto.modelo || ""
                    )}
                </h3>

                <p>
                    🔢
                    <strong>Placa:</strong>
                    ${escaparHTML(
                        moto.placa || "Sem placa"
                    )}
                </p>

                <p>
                    📆
                    <strong>Ano:</strong>
                    ${escaparHTML(
                        moto.ano || "Não informado"
                    )}
                </p>

                <p>
                    🛣️
                    <strong>Quilometragem:</strong>
                    ${escaparHTML(
                        moto.km || "Não informado"
                    )}
                </p>

            `;


            lista.appendChild(
                bloco
            );

        }
    );

}


document
.getElementById("botaoCadastrar")
.addEventListener(
    "click",
    async function() {

        const botao =
            this;

        const mensagem =
            document.getElementById(
                "mensagem"
            );


        if (!clienteLogado) {

            mostrarErro(
                "Seu cadastro de cliente não foi carregado."
            );

            return;

        }


        const marca =
            document
            .getElementById("marca")
            .value
            .trim();


        const modelo =
            document
            .getElementById("modelo")
            .value
            .trim();


        const ano =
            document
            .getElementById("ano")
            .value
            .trim();


        const placa =
            document
            .getElementById("placa")
            .value
            .trim()
            .toUpperCase();


        const km =
            document
            .getElementById("km")
            .value
            .trim();


        if (!marca) {

            alert(
                "⚠️ Informe a marca."
            );

            return;

        }


        if (!modelo) {

            alert(
                "⚠️ Informe o modelo."
            );

            return;

        }


        if (!placa) {

            alert(
                "⚠️ Informe a placa."
            );

            return;

        }


        botao.disabled = true;

        botao.textContent =
            "⏳ Cadastrando...";


        mensagem.innerHTML = "";


        try {

            const {
                error
            } = await supabaseClient
                .from("motos")
                .insert({

                    cliente_id:
                        Number(
                            clienteLogado.id
                        ),

                    marca:
                        marca,

                    modelo:
                        modelo,

                    ano:
                        ano || null,

                    placa:
                        placa,

                    km:
                        km || null

                });


            if (error) {

                throw error;

            }


            document.getElementById(
                "marca"
            ).value = "";


            document.getElementById(
                "modelo"
            ).value = "";


            document.getElementById(
                "ano"
            ).value = "";


            document.getElementById(
                "placa"
            ).value = "";


            document.getElementById(
                "km"
            ).value = "";


            mensagem.innerHTML = `
                <div class="mensagem sucesso">
                    ✅ Moto cadastrada com sucesso!
                </div>
            `;


            await carregarMotos();

        }

        catch (erro) {

            console.error(
                "ERRO AO CADASTRAR:",
                erro
            );


            mensagem.innerHTML = `
                <div class="mensagem erro">

                    ❌ Não foi possível cadastrar a moto.

                    <br><br>

                    ${escaparHTML(
                        erro.message ||
                        "Erro desconhecido."
                    )}

                </div>
            `;

        }

        finally {

            botao.disabled = false;

            botao.textContent =
                "💾 Cadastrar minha moto";

        }

    }
);


function mostrarErro(texto) {

    document.getElementById(
        "nomeCliente"
    ).innerHTML = `
        <div class="mensagem erro">
            ❌ ${escaparHTML(texto)}
        </div>
    `;


    document.getElementById(
        "listaMotos"
    ).innerHTML = "";

}


function escaparHTML(valor) {

    return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


iniciar();

</script>

</body>

</html>
