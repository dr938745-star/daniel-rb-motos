<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minhas Motos - DANIEL RB MOTOS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

}

}

.container {

}

}

.botao {

    font-size: 16px;

    cursor: pointer;
    text-align: center;
}

.botao:hover {
    background: #eeeeee;
}


/* BOTÃO EXCLUIR */

.botao-excluir {
    background: #b00000;

    border: 2px solid #b00000;
}

.botao-excluir:hover {

}


/* MOTOS */

.moto {
    border-top: 1px solid #ddd;
    padding-top: 18px;
    margin-top: 18px;
}

.moto h3 {
    margin-top: 0;
}

.vazio {
    color: #666;
    text-align: center;

}


/* BOTÃO VOLTAR */

.area-voltar {

}

}


/* OUTROS */

.oculto {

}

}

}

</style></head><body><header><h1>🏍️ Minhas Motos</h1><p>DANIEL RB MOTOS</p></header><!-- BOTÃO VOLTAR --><div class="area-voltar"><a
href="oficina.html"
class="voltar"

«»

← Voltar para a Área da Oficina

</a></div><div class="container"><!-- CLIENTE SELECIONADO --><div
    id="infoCliente"
    class="card oculto"
><h2>👤 Cliente</h2>

<div
    id="nomeCliente"
    class="info-cliente"
></div>

</div><!-- CADASTRAR MOTO --><div class="card"><h2>➕ Cadastrar moto</h2>


<label for="cliente">
    Proprietário
</label>

<select id="cliente">

    <option value="">
        Selecione o cliente
    </option>

</select>


<label for="marca">
    Marca
</label>

<input
    type="text"
    id="marca"
    placeholder="Ex.: Honda"
>


<label for="modelo">
    Modelo
</label>

<input
    type="text"
    id="modelo"
    placeholder="Ex.: Bros 160"
>


<label for="ano">
    Ano
</label>

<input
    type="text"
    id="ano"
    inputmode="numeric"
    maxlength="4"
    placeholder="Ex.: 2020"
>


<label for="placa">
    Placa
</label>

<input
    type="text"
    id="placa"
    maxlength="7"
    placeholder="Ex.: ABC1D23"
>


<!-- QUILOMETRAGEM -->

<label for="km">
    Quilometragem
</label>

<input
    type="text"
    id="km"
    inputmode="numeric"
    placeholder="Ex.: 35.000 km"
>


<!-- BOTÃO DE CADASTRAR -->

<button
    type="button"
    id="botaoCadastrar"
    class="botao"
    onclick="salvarMoto()"
>
    💾 Cadastrar moto
</button>


<div id="mensagem"></div>

</div><!-- MOTOS CADASTRADAS --><div class="card"><h2>📋 Motos cadastradas</h2>

<div id="listaMotos"></div>

</div></div><script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   CLIENTE SELECIONADO
===================================================== */

let clienteSelecionado =
localStorage.getItem(
    "clienteSelecionado"
);


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes() {

    const select =
        document.getElementById(
            "cliente"
        );


    select.innerHTML = `
        <option value="">
            Selecione o cliente
        </option>
    `;


    const {
        data: clientes,
        error
    } = await supabaseClient
        .from("clientes_nova")
        .select("id,nome")
        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar clientes:",
            error
        );


        select.innerHTML = `
            <option value="">
                Erro ao carregar clientes
            </option>
        `;

        return;

    }


    (clientes || []).forEach(
        function(cliente) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                cliente.nome;


            select.appendChild(
                option
            );

        }
    );


    if (clienteSelecionado) {

        select.value =
            String(
                clienteSelecionado
            );


        await mostrarClienteSelecionado(
            clienteSelecionado
        );

    }

}


/* =====================================================
   MOSTRAR CLIENTE
===================================================== */

async function mostrarClienteSelecionado(id) {

    if (!id) {

        return;

    }


    const {
        data: cliente,
        error
    } = await supabaseClient
        .from("clientes_nova")
        .select("id,nome")
        .eq(
            "id",
            id
        )
        .single();


    if (
        error ||
        !cliente
    ) {

        return;

    }


    document
        .getElementById(
            "infoCliente"
        )
        .classList.remove(
            "oculto"
        );


    document.getElementById(
        "nomeCliente"
    ).innerHTML =
        "👤 <strong>" +
        cliente.nome +
        "</strong>";

}


/* =====================================================
   TROCAR CLIENTE
===================================================== */

document
    .getElementById("cliente")
    .addEventListener(
        "change",
        async function() {

            const id =
                this.value;


            if (id) {

                clienteSelecionado =
                    id;


                localStorage.setItem(
                    "clienteSelecionado",
                    id
                );


                await mostrarClienteSelecionado(
                    id
                );

            } else {

                clienteSelecionado =
                    null;


                localStorage.removeItem(
                    "clienteSelecionado"
                );


                document
                    .getElementById(
                        "infoCliente"
                    )
                    .classList.add(
                        "oculto"
                    );

            }


            await mostrarMotos();

        }
    );


/* =====================================================
   QUILOMETRAGEM
===================================================== */

function limparQuilometragem(valor) {

    return valor.replace(
        /\D/g,
        ""
    );

}


function formatarQuilometragem(valor) {

    const numero =
        limparQuilometragem(
            valor
        );


    if (!numero) {

        return "";

    }


    return Number(numero)
        .toLocaleString(
            "pt-BR"
        );

}


/* =====================================================
   CAMPO DE QUILOMETRAGEM
===================================================== */

document
    .getElementById("km")
    .addEventListener(
        "input",
        function() {

            this.value =
                formatarQuilometragem(
                    this.value
                );

        }
    );


/* =====================================================
   SALVAR MOTO
===================================================== */

async function salvarMoto() {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const botao =
        document.getElementById(
            "botaoCadastrar"
        );


    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const marca =
        document.getElementById(
            "marca"
        ).value.trim();


    const modelo =
        document.getElementById(
            "modelo"
        ).value.trim();


    const ano =
        document.getElementById(
            "ano"
        ).value.trim();


    const placa =
        document.getElementById(
            "placa"
        ).value
        .trim()
        .toUpperCase();


    const kmTexto =
        document.getElementById(
            "km"
        ).value.trim();


    const km =
        limparQuilometragem(
            kmTexto
        );


    /* VALIDAÇÕES */

    if (!clienteId) {

        alert(
            "⚠️ Selecione o proprietário."
        );

        return;

    }


    if (!marca) {

        alert(
            "⚠️ Informe a marca."
        );

        return;

    }


    if (!modelo) {

        alert(
            "⚠️ Informe o modelo."
        );

        return;

    }


    if (!placa) {

        alert(
            "⚠️ Informe a placa."
        );

        return;

    }


    if (
        ano &&
        !/^\d{4}$/.test(ano)
    ) {

        alert(
            "⚠️ Informe um ano válido com 4 números."
        );

        return;

    }


    /* DESABILITA O BOTÃO ENQUANTO SALVA */

    botao.disabled = true;

    botao.innerHTML =
        "⏳ Salvando moto...";


    mensagem.innerHTML = `
        <div class="mensagem">
            ⏳ Salvando cadastro...
        </div>
    `;


    try {

        const novaMoto = {

            cliente_id:
                Number(clienteId),

            marca:
                marca,

            modelo:
                modelo,

            placa:
                placa,

            ano:
                ano || null,

            km:
                km
                    ? Number(km)
                    : null

        };


        const {
            data,
            error
        } = await supabaseClient
            .from("motos")
            .insert(
                novaMoto
            )
            .select(
                "id,created_at,cliente_id,marca,modelo,placa,ano,km"
            )
            .single();


        if (error) {

            throw error;

        }


        /* LIMPA OS CAMPOS */

        document.getElementById(
            "marca"
        ).value = "";


        document.getElementById(
            "modelo"
        ).value = "";


        document.getElementById(
            "ano"
        ).value = "";


        document.getElementById(
            "placa"
        ).value = "";


        document.getElementById(
            "km"
        ).value = "";


        mensagem.innerHTML = `
            <div class="mensagem sucesso">
                ✅ Moto cadastrada com sucesso!
            </div>
        `;


        await mostrarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO SALVAR MOTO:",
            erro
        );


        mensagem.innerHTML = `
            <div class="mensagem erro">

                ❌ Erro ao cadastrar a moto.

                <br><br>

                ${erro.message || erro}

            </div>
        `;

    }

    finally {

        botao.disabled = false;

        botao.innerHTML =
            "💾 Cadastrar moto";

    }

}


/* =====================================================
   CARREGAR MOTOS
===================================================== */

async function carregarMotos() {

    let consulta =
        supabaseClient
            .from("motos")
            .select(
                "id,created_at,cliente_id,marca,modelo,placa,ano,km"
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (clienteSelecionado) {

        consulta =
            consulta.eq(
                "cliente_id",
                Number(
                    clienteSelecionado
                )
            );

    }


    const {
        data: motos,
        error
    } = await consulta;


    if (error) {

        throw error;

    }


    return motos || [];

}


/* =====================================================
   MOSTRAR MOTOS
===================================================== */

async function mostrarMotos() {

    const lista =
        document.getElementById(
            "listaMotos"
        );


    lista.innerHTML = `
        <div class="vazio">
            ⏳ Carregando motos...
        </div>
    `;


    try {

        const motos =
            await carregarMotos();


        if (
            motos.length === 0
        ) {

            lista.innerHTML = `
                <div class="vazio">
                    🏍️ Nenhuma moto cadastrada para este cliente.
                </div>
            `;

            return;

        }


        lista.innerHTML = "";


        for (
            const moto of motos
        ) {

            let nomeCliente =
                "Cliente não encontrado";


            const {
                data: cliente,
                error
            } = await supabaseClient
                .from("clientes_nova")
                .select("nome")
                .eq(
                    "id",
                    moto.cliente_id
                )
                .single();


            if (
                !error &&
                cliente
            ) {

                nomeCliente =
                    cliente.nome;

            }


            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "moto";


            const kmExibicao =
                moto.km != null
                    ? Number(moto.km)
                        .toLocaleString(
                            "pt-BR"
                        ) +
                        " km"
                    : "Não informado";


            bloco.innerHTML = `

                <h3>
                    🏍️
                    ${moto.marca || ""}
                    ${moto.modelo || ""}
                </h3>


                <p>
                    👤
                    <strong>Proprietário:</strong>
                    ${nomeCliente}
                </p>


                <p>
                    🔢
                    <strong>Placa:</strong>
                    ${moto.placa || "Sem placa"}
                </p>


                <p>
                    📆
                    <strong>Ano:</strong>
                    ${moto.ano || "Não informado"}
                </p>


                <p>
                    🛣️
                    <strong>Quilometragem:</strong>
                    ${kmExibicao}
                </p>


                <button
                    type="button"
                    class="botao botao-excluir"
                    onclick="excluirMoto(${Number(moto.id)})"
                >
                    🗑️ Tirar esta moto do cliente
                </button>

            `;


            lista.appendChild(
                bloco
            );

        }

    }

    catch (erro) {

        console.error(
            "ERRO AO CARREGAR MOTOS:",
            erro
        );


        lista.innerHTML = `
            <div class="mensagem erro">

                ❌ Erro ao carregar motos.

                <br><br>

                ${erro.message || erro}

            </div>
        `;

    }

}


/* =====================================================
   EXCLUIR MOTO
===================================================== */

async function excluirMoto(id) {

    if (!id) {

        alert(
            "⚠️ ID da moto inválido."
        );

        return;

    }


    const confirmar =
        confirm(
            "⚠️ Tem certeza que deseja tirar esta moto do cadastro deste cliente?\n\n" +
            "A moto será excluída do sistema."
        );


    if (!confirmar) {

        return;

    }


    try {

        const {
            error
        } = await supabaseClient
            .from("motos")
            .delete()
            .eq(
                "id",
                Number(id)
            );


        if (error) {

            throw error;

        }


        alert(
            "✅ Moto retirada do cadastro com sucesso!"
        );


        await mostrarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO EXCLUIR MOTO:",
            erro
        );


        alert(
            "❌ Não foi possível retirar a moto.\n\n" +
            (
                erro.message ||
                erro
            )
        );

    }

}


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    await carregarClientes();

    await mostrarMotos();

}


iniciar();

</script></body></html>
