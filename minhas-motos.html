/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   CLIENTE SELECIONADO
===================================================== */

const clienteSelecionado =
localStorage.getItem(
    "clienteSelecionado"
);


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes() {

    const select =
        document.getElementById(
            "cliente"
        );

    select.innerHTML = `
        <option value="">
            Selecione o cliente
        </option>
    `;


    const {
        data: clientes,
        error
    } = await supabaseClient
        .from("clientes_nova")
        .select("id,nome")
        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar clientes:",
            error
        );

        select.innerHTML = `
            <option value="">
                Erro ao carregar clientes
            </option>
        `;

        return;

    }


    (clientes || []).forEach(
        function(cliente) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                cliente.id;

            option.textContent =
                cliente.nome;

            select.appendChild(
                option
            );

        }
    );


    if (clienteSelecionado) {

        select.value =
            String(
                clienteSelecionado
            );

        mostrarClienteSelecionado(
            clienteSelecionado
        );

    }

}


/* =====================================================
   MOSTRAR CLIENTE SELECIONADO
===================================================== */

async function mostrarClienteSelecionado(id) {

    if (!id) {
        return;
    }


    const {
        data: cliente
    } = await supabaseClient
        .from("clientes_nova")
        .select("id,nome")
        .eq(
            "id",
            id
        )
        .single();


    if (!cliente) {
        return;
    }


    document
        .getElementById(
            "infoCliente"
        )
        .classList.remove(
            "oculto"
        );


    document.getElementById(
        "nomeCliente"
    ).innerHTML =
        "👤 <strong>" +
        cliente.nome +
        "</strong>";

}


/* =====================================================
   SALVAR MOTO
===================================================== */

async function salvarMoto() {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const marca =
        document.getElementById(
            "marca"
        ).value.trim();


    const modelo =
        document.getElementById(
            "modelo"
        ).value.trim();


    const ano =
        document.getElementById(
            "ano"
        ).value.trim();


    const placa =
        document.getElementById(
            "placa"
        ).value
        .trim()
        .toUpperCase();


    const km =
        document.getElementById(
            "km"
        ).value.trim();


    if (!clienteId) {

        alert(
            "⚠️ Selecione o proprietário."
        );

        return;

    }


    if (!marca) {

        alert(
            "⚠️ Informe a marca."
        );

        return;

    }


    if (!modelo) {

        alert(
            "⚠️ Informe o modelo."
        );

        return;

    }


    if (!placa) {

        alert(
            "⚠️ Informe a placa."
        );

        return;

    }


    mensagem.innerHTML = `
        <div class="mensagem">
            ⏳ Salvando moto...
        </div>
    `;


    try {

        const novaMoto = {

            cliente_id:
                Number(clienteId),

            marca:
                marca,

            modelo:
                modelo,

            placa:
                placa,

            ano:
                ano || null,

            km:
                km || null

        };


        const {
            data,
            error
        } = await supabaseClient
            .from("motos")
            .insert(
                novaMoto
            )
            .select(
                "id,created_at,cliente_id,marca,modelo,placa,ano,km"
            )
            .single();


        if (error) {

            throw error;

        }


        document.getElementById(
            "marca"
        ).value = "";

        document.getElementById(
            "modelo"
        ).value = "";

        document.getElementById(
            "ano"
        ).value = "";

        document.getElementById(
            "placa"
        ).value = "";

        document.getElementById(
            "km"
        ).value = "";


        mensagem.innerHTML = `
            <div class="mensagem sucesso">
                ✅ Moto cadastrada com sucesso!
            </div>
        `;


        await mostrarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO SALVAR MOTO:",
            erro
        );


        mensagem.innerHTML = `
            <div class="mensagem erro">

                ❌ Erro ao cadastrar a moto.

                <br><br>

                ${erro.message || erro}

            </div>
        `;

    }

}


/* =====================================================
   CARREGAR MOTOS
===================================================== */

async function carregarMotos() {

    let consulta =
        supabaseClient
            .from("motos")
            .select(
                "id,created_at,cliente_id,marca,modelo,placa,ano,km"
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


    /*
       MANTÉM A FUNÇÃO ORIGINAL:
       SE UM CLIENTE FOI SELECIONADO,
       MOSTRA SOMENTE AS MOTOS DELE.
    */

    if (clienteSelecionado) {

        consulta =
            consulta.eq(
                "cliente_id",
                Number(
                    clienteSelecionado
                )
            );

    }


    const {
        data: motos,
        error
    } = await consulta;


    if (error) {

        throw error;

    }


    return motos || [];

}


/* =====================================================
   MOSTRAR MOTOS
===================================================== */

async function mostrarMotos() {

    const lista =
        document.getElementById(
            "listaMotos"
        );


    lista.innerHTML = `
        <div class="vazio">
            ⏳ Carregando motos...
        </div>
    `;


    try {

        const motos =
            await carregarMotos();


        if (
            motos.length === 0
        ) {

            lista.innerHTML = `
                <div class="vazio">
                    🏍️ Nenhuma moto cadastrada.
                </div>
            `;

            return;

        }


        lista.innerHTML = "";


        for (
            const moto of motos
        ) {

            let nomeCliente =
                "Cliente não encontrado";


            const {
                data: cliente,
                error
            } = await supabaseClient
                .from("clientes_nova")
                .select("nome")
                .eq(
                    "id",
                    moto.cliente_id
                )
                .single();


            if (
                !error &&
                cliente
            ) {

                nomeCliente =
                    cliente.nome;

            }


            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "moto";


            bloco.innerHTML = `

                <h3>

                    🏍️
                    ${moto.marca || ""}
                    ${moto.modelo || ""}

                </h3>


                <p>

                    👤
                    <strong>Proprietário:</strong>
                    ${nomeCliente}

                </p>


                <p>

                    🔢
                    <strong>Placa:</strong>
                    ${moto.placa || "Sem placa"}

                </p>


                <p>

                    📆
                    <strong>Ano:</strong>
                    ${moto.ano || "Não informado"}

                </p>


                <p>

                    🛣️
                    <strong>KM:</strong>
                    ${moto.km || "Não informado"}

                </p>


                <button
                    type="button"
                    class="botao botao-excluir"
                    onclick="excluirMoto(${Number(moto.id)})"
                >

                    🗑️ Tirar esta moto do cliente

                </button>

            `;


            lista.appendChild(
                bloco
            );

        }

    }

    catch (erro) {

        console.error(
            "ERRO AO CARREGAR MOTOS:",
            erro
        );


        lista.innerHTML = `
            <div class="mensagem erro">

                ❌ Erro ao carregar motos.

                <br><br>

                ${erro.message || erro}

            </div>
        `;

    }

}


/* =====================================================
   EXCLUIR / TIRAR MOTO DO CLIENTE
===================================================== */

async function excluirMoto(id) {

    if (!id) {

        alert(
            "⚠️ Não foi possível identificar esta moto."
        );

        return;

    }


    const confirmar =
        confirm(
            "⚠️ Tem certeza que deseja tirar esta moto do cadastro do cliente?\n\n" +
            "A moto será excluída do sistema."
        );


    if (!confirmar) {

        return;

    }


    try {

        const {
            error
        } = await supabaseClient
            .from("motos")
            .delete()
            .eq(
                "id",
                Number(id)
            );


        if (error) {

            throw error;

        }


        alert(
            "✅ Moto retirada do cadastro com sucesso!"
        );


        await mostrarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO EXCLUIR MOTO:",
            erro
        );


        alert(
            "❌ Não foi possível retirar a moto.\n\n" +
            (
                erro.message ||
                erro
            )
        );

    }

}


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    await carregarClientes();

    await mostrarMotos();

}


iniciar();

</script></body></html>
