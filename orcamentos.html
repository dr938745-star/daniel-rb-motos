<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let clienteSelecionado = null;
let motoSelecionada = null;


/* =====================================================
   GERAR NÚMERO DO ORÇAMENTO
===================================================== */

function gerarNumero() {

    const numero =
        Date.now()
        .toString()
        .slice(-6);

    document.getElementById(
        "numero"
    ).value = numero;

}


/* =====================================================
   VERIFICAR UUID
===================================================== */

function ehUUID(valor) {

    if (!valor) {
        return false;
    }

    const uuid =
        String(valor).trim();

    const regex =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    return regex.test(uuid);

}


/* =====================================================
   CARREGAR CLIENTES DO SUPABASE
===================================================== */

async function carregarClientes() {

    const select =
        document.getElementById(
            "cliente"
        );

    const mensagem =
        document.getElementById(
            "mensagemCliente"
        );

    select.innerHTML = `
        <option value="">
            🔍 Carregando clientes...
        </option>
    `;

    mensagem.innerHTML = "";

    try {

        const {
            data: clientes,
            error
        } =
            await supabaseClient
            .from("clientes_nova")
            .select(
                "id,nome,cpf,telefone,email,endereco"
            )
            .order(
                "nome",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "ERRO AO CARREGAR CLIENTES:",
                error
            );

            select.innerHTML = `
                <option value="">
                    ❌ Erro ao carregar clientes
                </option>
            `;

            mensagem.innerHTML = `
                <div class="erro">
                    ❌ Não foi possível carregar os clientes.
                    <br><br>
                    ${error.message}
                </div>
            `;

            return;

        }


        if (
            !clientes ||
            clientes.length === 0
        ) {

            select.innerHTML = `
                <option value="">
                    Nenhum cliente cadastrado
                </option>
            `;

            mensagem.innerHTML = `
                <div class="erro">
                    ⚠️ Nenhum cliente foi encontrado na tabela clientes_nova.
                </div>
            `;

            return;

        }


        select.innerHTML = `
            <option value="">
                Selecione o cliente
            </option>
        `;


        clientes.forEach(
            function(cliente) {

                if (
                    !cliente.id ||
                    !ehUUID(cliente.id)
                ) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    cliente.id;


                option.textContent =
                    cliente.nome ||
                    "Cliente sem nome";


                option.dataset.telefone =
                    cliente.telefone || "";


                option.dataset.cpf =
                    cliente.cpf || "";


                select.appendChild(
                    option
                );

            }
        );


        mensagem.innerHTML = `
            <div class="sucesso">
                ✅ ${clientes.length} cliente(s) carregado(s).
            </div>
        `;

    }

    catch (erro) {

        console.error(
            "ERRO GERAL:",
            erro
        );

        select.innerHTML = `
            <option value="">
                ❌ Erro
            </option>
        `;

        mensagem.innerHTML = `
            <div class="erro">
                ❌ Erro ao conectar ao Supabase.
                <br><br>
                ${erro.message || erro}
            </div>
        `;

    }

}


/* =====================================================
   CARREGAR MOTOS DO CLIENTE
===================================================== */

async function carregarMotosDoCliente() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const selectMoto =
        document.getElementById(
            "moto"
        );


    const telefone =
        document.getElementById(
            "telefone"
        );


    const placa =
        document.getElementById(
            "placa"
        );


    clienteSelecionado =
        clienteId;


    motoSelecionada =
        null;


    selectMoto.innerHTML = `
        <option value="">
            🔍 Carregando motos...
        </option>
    `;


    telefone.value = "";
    placa.value = "";


    if (!clienteId) {

        selectMoto.innerHTML = `
            <option value="">
                Selecione primeiro o cliente
            </option>
        `;

        return;

    }


    if (!ehUUID(clienteId)) {

        selectMoto.innerHTML = `
            <option value="">
                ❌ ID do cliente inválido
            </option>
        `;

        return;

    }


    const clienteSelect =
        document.getElementById(
            "cliente"
        );


    const opcao =
        clienteSelect.options[
            clienteSelect.selectedIndex
        ];


    if (opcao) {

        telefone.value =
            opcao.dataset.telefone || "";

    }


    try {

        const {
            data: motos,
            error
        } =
            await supabaseClient
            .from("motos")
            .select(
                "id,cliente_id,marca,modelo,placa,ano,km"
            )
            .eq(
                "cliente_id",
                clienteId
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "ERRO AO CARREGAR MOTOS:",
                error
            );

            selectMoto.innerHTML = `
                <option value="">
                    ❌ Erro ao carregar motos
                </option>
            `;

            alert(
                "❌ Erro ao carregar as motos:\n\n" +
                error.message
            );

            return;

        }


        if (
            !motos ||
            motos.length === 0
        ) {

            selectMoto.innerHTML = `
                <option value="">
                    Nenhuma moto cadastrada
                </option>
            `;

            return;

        }


        selectMoto.innerHTML = `
            <option value="">
                Selecione a moto
            </option>
        `;


        motos.forEach(
            function(moto) {

                if (
                    !moto.id ||
                    !ehUUID(moto.id)
                ) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    moto.id;


                option.textContent =
                    (
                        moto.marca || ""
                    ) +
                    " " +
                    (
                        moto.modelo || "Moto"
                    ) +
                    " - " +
                    (
                        moto.placa || "Sem placa"
                    );


                option.dataset.placa =
                    moto.placa || "";


                selectMoto.appendChild(
                    option
                );

            }
        );

    }

    catch (erro) {

        console.error(
            "ERRO GERAL MOTOS:",
            erro
        );

        selectMoto.innerHTML = `
            <option value="">
                ❌ Erro
            </option>
        `;

        alert(
            "❌ Erro ao carregar motos:\n\n" +
            (erro.message || erro)
        );

    }

}


/* =====================================================
   PREENCHER MOTO
===================================================== */

function preencherMoto() {

    const motoId =
        document.getElementById(
            "moto"
        ).value;


    motoSelecionada =
        motoId;


    const select =
        document.getElementById(
            "moto"
        );


    const opcao =
        select.options[
            select.selectedIndex
        ];


    document.getElementById(
        "placa"
    ).value =
        opcao
        ? (
            opcao.dataset.placa ||
            ""
        )
        : "";

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotal() {

    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    document.getElementById(
        "total"
    ).textContent =
        formatarMoeda(total);

}


/* =====================================================
   PEGAR DADOS
===================================================== */

function pegarDadosOrcamento() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const motoId =
        document.getElementById(
            "moto"
        ).value;


    const numero =
        document.getElementById(
            "numero"
        ).value;


    const servico =
        document.getElementById(
            "servico"
        ).value.trim();


    const diagnostico =
        document.getElementById(
            "diagnostico"
        ).value.trim();


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    const status =
        document.getElementById(
            "status"
        ).value;


    return {

        cliente_id:
            clienteId,

        moto_id:
            motoId,

        numero:
            numero,

        servico:
            servico,

        diagnostico:
            diagnostico,

        mao_de_obra:
            mao,

        pecas:
            pecas,

        total:
            total,

        status:
            status

    };

}


/* =====================================================
   SALVAR ORÇAMENTO
===================================================== */

async function salvarOrcamento() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const motoId =
        document.getElementById(
            "moto"
        ).value;


    if (!clienteId) {

        alert(
            "⚠️ Selecione o cliente."
        );

        return;

    }


    if (!ehUUID(clienteId)) {

        alert(
            "❌ O ID do cliente não é um UUID válido."
        );

        return;

    }


    if (!motoId) {

        alert(
            "⚠️ Selecione a moto."
        );

        return;

    }


    if (!ehUUID(motoId)) {

        alert(
            "❌ O ID da moto não é um UUID válido."
        );

        return;

    }


    const dados =
        pegarDadosOrcamento();


    if (!dados.servico) {

        alert(
            "⚠️ Informe o serviço solicitado."
        );

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("orcamentos")
            .insert([
                dados
            ])
            .select()
            .single();


        if (error) {

            console.error(
                "ERRO AO SALVAR ORÇAMENTO:",
                error
            );

            alert(
                "❌ Erro ao salvar orçamento.\n\n" +
                error.message
            );

            return;

        }


        alert(
            "✅ Orçamento nº " +
            data.numero +
            " salvo com sucesso!"
        );


        limparFormulario();


        carregarOrcamentos();

    }

    catch (erro) {

        console.error(
            "ERRO GERAL:",
            erro
        );

        alert(
            "❌ Erro ao salvar orçamento.\n\n" +
            (erro.message || erro)
        );

    }

}


/* =====================================================
   CARREGAR ORÇAMENTOS
===================================================== */

async function carregarOrcamentos() {

    const lista =
        document.getElementById(
            "lista"
        );


    lista.innerHTML =
        "🔍 Carregando orçamentos...";


    try {

        const {
            data: orcamentos,
            error
        } =
            await supabaseClient
            .from("orcamentos")
            .select(
                `
                id,
                created_at,
                cliente_id,
                moto_id,
                numero,
                servico,
                diagnostico,
                mao_de_obra,
                pecas,
                total,
                status
                `
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "ERRO ORÇAMENTOS:",
                error
            );

            lista.innerHTML = `
                <div class="erro">
                    ❌ Erro ao carregar orçamentos.
                    <br><br>
                    ${error.message}
                </div>
            `;

            return;

        }


        if (
            !orcamentos ||
            orcamentos.length === 0
        ) {

            lista.innerHTML =
                "Nenhum orçamento cadastrado.";

            return;

        }


        lista.innerHTML = "";


        for (
            const item of orcamentos
        ) {

            let nomeCliente =
                "Cliente";


            let descricaoMoto =
                "Moto";


            /* BUSCAR CLIENTE */

            if (
                item.cliente_id &&
                ehUUID(item.cliente_id)
            ) {

                const {
                    data: cliente
                } =
                    await supabaseClient
                    .from("clientes_nova")
                    .select(
                        "nome"
                    )
                    .eq(
                        "id",
                        item.cliente_id
                    )
                    .maybeSingle();


                if (cliente) {

                    nomeCliente =
                        cliente.nome ||
                        "Cliente";

                }

            }


            /* BUSCAR MOTO */

            if (
                item.moto_id &&
                ehUUID(item.moto_id)
            ) {

                const {
                    data: moto
                } =
                    await supabaseClient
                    .from("motos")
                    .select(
                        "marca,modelo,placa"
                    )
                    .eq(
                        "id",
                        item.moto_id
                    )
                    .maybeSingle();


                if (moto) {

                    descricaoMoto =
                        (
                            moto.marca || ""
                        ) +
                        " " +
                        (
                            moto.modelo || ""
                        );


                    if (moto.placa) {

                        descricaoMoto +=
                            " - " +
                            moto.placa;

                    }

                }

            }


            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "orcamento-item";


            bloco.innerHTML = `

                <h3>
                    💰 Orçamento nº
                    ${item.numero || ""}
                </h3>

                <strong>
                    👤 ${nomeCliente}
                </strong>

                <br>

                🏍️ ${descricaoMoto}

                <br><br>

                🔧
                ${item.servico || "Serviço não informado"}

                <br><br>

                <span class="status">
                    ${item.status || "Pendente"}
                </span>

                <p>
                    <strong>Total:</strong>
                    ${formatarMoeda(item.total)}
                </p>

            `;


            lista.appendChild(
                bloco
            );

        }

    }

    catch (erro) {

        console.error(
            "ERRO:",
            erro
        );

        lista.innerHTML = `
            <div class="erro">
                ❌ Erro ao carregar os orçamentos.
                <br><br>
                ${erro.message || erro}
            </div>
        `;

    }

}


/* =====================================================
   APROVAR ORÇAMENTO ATUAL
===================================================== */

async function aprovarOrcamento() {

    const numero =
        document.getElementById(
            "numero"
        ).value;


    if (!numero) {

        alert(
            "⚠️ Número do orçamento não encontrado."
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("orcamentos")
        .update({
            status: "Aprovado"
        })
        .eq(
            "numero",
            numero
        )
        .select()
        .maybeSingle();


    if (error) {

        alert(
            "❌ Erro ao aprovar orçamento.\n\n" +
            error.message
        );

        return;

    }


    if (!data) {

        alert(
            "⚠️ Salve o orçamento primeiro."
        );

        return;

    }


    document.getElementById(
        "status"
    ).value =
        "Aprovado";


    alert(
        "✅ Orçamento nº " +
        numero +
        " aprovado!"
    );


    carregarOrcamentos();

}


/* =====================================================
   ENVIAR WHATSAPP
===================================================== */

function enviarWhatsApp() {

    const telefone =
        document.getElementById(
            "telefone"
        ).value;


    if (!telefone) {

        alert(
            "⚠️ O cliente não possui telefone cadastrado."
        );

        return;

    }


    const clienteSelect =
        document.getElementById(
            "cliente"
        );


    const motoSelect =
        document.getElementById(
            "moto"
        );


    const cliente =
        clienteSelect.options[
            clienteSelect.selectedIndex
        ]
        ? clienteSelect.options[
            clienteSelect.selectedIndex
        ].text
        : "Cliente";


    const moto =
        motoSelect.options[
            motoSelect.selectedIndex
        ]
        ? motoSelect.options[
            motoSelect.selectedIndex
        ].text
        : "Moto";


    const servico =
        document.getElementById(
            "servico"
        ).value;


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    const mensagem =

        "Olá, " +
        cliente +
        "! 👋\n\n" +

        "Aqui é da DANIEL RB MOTOS.\n\n" +

        "📋 *ORÇAMENTO Nº " +
        document.getElementById(
            "numero"
        ).value +
        "*\n\n" +

        "🏍️ Moto: " +
        moto +
        "\n" +

        "🔧 Serviço: " +
        servico +
        "\n\n" +

        "💰 Mão de obra: " +
        formatarMoeda(mao) +
        "\n" +

        "🔩 Peças: " +
        formatarMoeda(pecas) +
        "\n\n" +

        "💵 *TOTAL: " +
        formatarMoeda(total) +
        "*\n\n" +

        "Aguardamos sua aprovação. 😊";


    let numeroWhatsApp =
        telefone.replace(
            /\D/g,
            ""
        );


    if (
        numeroWhatsApp.length === 10 ||
        numeroWhatsApp.length === 11
    ) {

        numeroWhatsApp =
            "55" +
            numeroWhatsApp;

    }


    window.open(
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        encodeURIComponent(
            mensagem
        ),
        "_blank"
    );

}


/* =====================================================
   TRANSFORMAR EM OS
===================================================== */

async function transformarEmOS() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const motoId =
        document.getElementById(
            "moto"
        ).value;


    if (!clienteId) {

        alert(
            "⚠️ Selecione o cliente."
        );

        return;

    }


    if (!motoId) {

        alert(
            "⚠️ Selecione a moto."
        );

        return;

    }


    if (!ehUUID(clienteId)) {

        alert(
            "❌ ID do cliente inválido."
        );

        return;

    }


    if (!ehUUID(motoId)) {

        alert(
            "❌ ID da moto inválido."
        );

        return;

    }


    const dados =
        pegarDadosOrcamento();


    localStorage.setItem(
        "dadosOrcamentoParaOS",
        JSON.stringify(
            dados
        )
    );


    window.location.href =
        "ordem-servico.html";

}

/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}
