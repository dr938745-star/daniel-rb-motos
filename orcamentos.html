<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   VERIFICAR UUID
========================================== */

function ehUUID(valor) {

    if (!valor) {
        return false;
    }

    const texto =
        String(valor).trim();

    const regex =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    return regex.test(texto);

}


/* ==========================================
   MOSTRAR ERRO DE UUID
========================================== */

function mostrarErroUUID(tipo, valor) {

    const nome =
        tipo === "cliente"
        ? "cliente"
        : "moto";

    alert(
        "❌ ID inválido do " +
        nome +
        ".\n\n" +

        "O sistema recebeu:\n" +
        String(valor) +
        "\n\n" +

        "Esse valor não é um UUID válido.\n\n" +

        "Não foi enviado nada para o banco."
    );

}


/* ==========================================
   GERAR NÚMERO
========================================== */

function gerarNumero() {

    const numero =
        Date.now()
        .toString()
        .slice(-6);

    document.getElementById(
        "numero"
    ).value =
        numero;

}


/* ==========================================
   CARREGAR CLIENTES
========================================== */

async function carregarClientes() {

    const select =
        document.getElementById(
            "cliente"
        );


    select.innerHTML = `
        <option value="">
            Carregando clientes...
        </option>
    `;


    try {

        const {
            data: clientes,
            error
        } =
            await supabaseClient
            .from("clientes_nova")
            .select(
                "id,nome,telefone,whatsapp"
            )
            .order(
                "nome",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "ERRO CLIENTES:",
                error
            );


            select.innerHTML = `
                <option value="">
                    Erro ao carregar clientes
                </option>
            `;


            alert(
                "❌ Erro ao carregar clientes.\n\n" +
                error.message
            );


            return;

        }


        select.innerHTML = `
            <option value="">
                Selecione o cliente
            </option>
        `;


        (clientes || [])
        .forEach(
            function(cliente) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    cliente.id;


                option.textContent =
                    cliente.nome ||
                    "Cliente sem nome";


                option.dataset.telefone =
                    cliente.telefone ||
                    cliente.whatsapp ||
                    "";


                select.appendChild(
                    option
                );

            }
        );


    } catch (erro) {

        console.error(
            erro
        );


        select.innerHTML = `
            <option value="">
                Erro ao carregar clientes
            </option>
        `;


        alert(
            "❌ Erro ao carregar clientes.\n\n" +
            (erro.message || erro)
        );

    }

}


/* ==========================================
   CARREGAR MOTOS DO CLIENTE
========================================== */

async function carregarMotosDoCliente() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const selectCliente =
        document.getElementById(
            "cliente"
        );


    const selectMoto =
        document.getElementById(
            "moto"
        );


    const telefone =
        document.getElementById(
            "telefone"
        );


    selectMoto.innerHTML = `
        <option value="">
            Selecione a moto
        </option>
    `;


    document.getElementById(
        "placa"
    ).value = "";


    telefone.value = "";


    if (!clienteId) {

        selectMoto.innerHTML = `
            <option value="">
                Selecione primeiro o cliente
            </option>
        `;

        return;

    }


    /* ======================================
       PROTEÇÃO DO UUID DO CLIENTE
    ====================================== */

    if (!ehUUID(clienteId)) {

        mostrarErroUUID(
            "cliente",
            clienteId
        );

        selectCliente.value = "";


        return;

    }


    const optionCliente =
        selectCliente.options[
            selectCliente.selectedIndex
        ];


    if (optionCliente) {

        telefone.value =
            optionCliente.dataset.telefone ||
            "";

    }


    selectMoto.innerHTML = `
        <option value="">
            Carregando motos...
        </option>
    `;


    try {

        const {
            data: motos,
            error
        } =
            await supabaseClient
            .from("motos")
            .select(
                "id,cliente_id,marca,modelo,placa,ano,km"
            )
            .eq(
                "cliente_id",
                clienteId
            )
            .order(
                "marca",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "ERRO MOTOS:",
                error
            );


            selectMoto.innerHTML = `
                <option value="">
                    Erro ao carregar motos
                </option>
            `;


            alert(
                "❌ Erro ao carregar motos.\n\n" +
                error.message
            );


            return;

        }


        selectMoto.innerHTML = `
            <option value="">
                Selecione a moto
            </option>
        `;


        if (
            !motos ||
            motos.length === 0
        ) {

            selectMoto.innerHTML = `
                <option value="">
                    Nenhuma moto cadastrada
                </option>
            `;


            return;

        }


        motos.forEach(
            function(moto) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    moto.id;


                option.textContent =
                    (
                        moto.marca ||
                        ""
                    ) +
                    " " +
                    (
                        moto.modelo ||
                        ""
                    ) +
                    " - " +
                    (
                        moto.placa ||
                        "Sem placa"
                    );


                selectMoto.appendChild(
                    option
                );

            }
        );


    } catch (erro) {

        console.error(
            erro
        );


        selectMoto.innerHTML = `
            <option value="">
                Erro ao carregar motos
            </option>
        `;


        alert(
            "❌ Erro ao carregar motos.\n\n" +
            (erro.message || erro)
        );

    }

}


/* ==========================================
   PREENCHER MOTO
========================================== */

async function preencherMoto() {

    const motoId =
        document.getElementById(
            "moto"
        ).value;


    const placa =
        document.getElementById(
            "placa"
        );


    placa.value = "";


    if (!motoId) {

        return;

    }


    /* ======================================
       PROTEÇÃO DO UUID DA MOTO
    ====================================== */

    if (!ehUUID(motoId)) {

        mostrarErroUUID(
            "moto",
            motoId
        );


        document.getElementById(
            "moto"
        ).value = "";


        return;

    }


    try {

        const {
            data: motos,
            error
        } =
            await supabaseClient
            .from("motos")
            .select(
                "id,placa"
            )
            .eq(
                "id",
                motoId
            )
            .limit(1);


        if (error) {

            console.error(
                "ERRO MOTO:",
                error
            );

            return;

        }


        if (
            motos &&
            motos.length > 0
        ) {

            placa.value =
                motos[0].placa ||
                "";

        }

    } catch (erro) {

        console.error(
            erro
        );

    }

}


/* ==========================================
   CALCULAR TOTAL
========================================== */

function calcularTotal() {

    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    document.getElementById(
        "total"
    ).textContent =
        formatarMoeda(
            total
        );

}


/* ==========================================
   PEGAR DADOS
========================================== */

function pegarDadosOrcamento() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const motoId =
        document.getElementById(
            "moto"
        ).value;


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    return {

        cliente_id:
            clienteId,

        moto_id:
            motoId,

        numero:
            document.getElementById(
                "numero"
            ).value,

        servico:
            document.getElementById(
                "servico"
            ).value,

        diagnostico:
            document.getElementById(
                "diagnostico"
            ).value,

        mao_de_obra:
            mao,

        pecas:
            pecas,

        total:
            mao + pecas,

        status:
            document.getElementById(
                "status"
            ).value

    };

}


/* ==========================================
   SALVAR ORÇAMENTO
========================================== */

async function salvarOrcamento() {

    const clienteId =
        document.getElementById(
            "cliente"
        ).value;


    const motoId =
        document.getElementById(
            "moto"
        ).value;


    /* ======================================
       VALIDAR CLIENTE
    ====================================== */

    if (!clienteId) {

        alert(
            "⚠️ Selecione o cliente."
        );

        return;

    }


    if (!ehUUID(clienteId)) {

        mostrarErroUUID(
            "cliente",
            clienteId
        );

        return;

    }


    /* ======================================
       VALIDAR MOTO
    ====================================== */

    if (!motoId) {

        alert(
            "⚠️ Selecione a moto."
        );

        return;

    }


    if (!ehUUID(motoId)) {

        mostrarErroUUID(
            "moto",
            motoId
        );

        return;

    }


    const dados =
        pegarDadosOrcamento();


    /* ======================================
       CONFIRMAÇÃO FINAL DOS UUIDS
    ====================================== */

    if (
        !ehUUID(dados.cliente_id) ||
        !ehUUID(dados.moto_id)
    ) {

        alert(
            "❌ Não foi possível salvar.\n\n" +
            "O cliente ou a moto possui um ID inválido."
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnSalvar"
        );


    botao.disabled = true;

    botao.innerText =
        "💾 Salvando...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("orcamentos")
            .insert([
                dados
            ])
            .select()
            .single();


        if (error) {

            console.error(
                "ERRO AO SALVAR ORÇAMENTO:",
                error
            );


            alert(
                "❌ Erro ao salvar orçamento.\n\n" +
                error.message
            );


            return;

        }


        orcamentoAtual =
            data;


        alert(
            "✅ Orçamento nº " +
            dados.numero +
            " salvo com sucesso!"
        );


        mostrarOrcamentos();


    } catch (erro) {

        console.error(
            "ERRO GERAL:",
            erro
        );


        alert(
            "❌ Erro ao salvar orçamento.\n\n" +
            (erro.message || erro)
        );


    } finally {

        botao.disabled = false;

        botao.innerText =
            "💾 Salvar Orçamento";

    }

}


/* ==========================================
   APROVAR ORÇAMENTO
========================================== */

async function aprovarOrcamento() {

    const numero =
        document.getElementById(
            "numero"
        ).value;


    if (!numero) {

        alert(
            "⚠️ Número do orçamento não encontrado."
        );

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("orcamentos")
            .select(
                "id,status"
            )
            .eq(
                "numero",
                numero
            )
            .limit(1);


        if (error) {

            alert(
                "❌ Erro ao localizar orçamento.\n\n" +
                error.message
            );

            return;

        }


        if (
            !data ||
            data.length === 0
        ) {

            alert(
                "⚠️ Salve o orçamento primeiro."
            );

            return;

        }


        const {
            error: erroUpdate
        } =
            await supabaseClient
            .from("orcamentos")
            .update({
                status: "Aprovado"
            })
            .eq(
                "id",
                data[0].id
            );


        if (erroUpdate) {

            alert(
                "❌ Erro ao aprovar orçamento.\n\n" +
                erroUpdate.message
            );

            return;

        }


        document.getElementById(
            "status"
        ).value =
            "Aprovado";


        alert(
            "✅ Orçamento nº " +
            numero +
            " aprovado com sucesso!"
        );


        mostrarOrcamentos();


    } catch (erro) {

        alert(
            "❌ Erro ao aprovar orçamento.\n\n" +
            (erro.message || erro)
        );

    }

}


/* ==========================================
   MOSTRAR ORÇAMENTOS
========================================== */

async function mostrarOrcamentos() {

    const div =
        document.getElementById(
            "lista"
        );


    div.innerHTML =
        "Carregando orçamentos...";


    try {

        const {
            data: lista,
            error
        } =
            await supabaseClient
            .from("orcamentos")
            .select(
                "id,created_at,cliente_id,moto_id,numero,servico,diagnostico,mao_de_obra,pecas,total,status"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "ERRO ORÇAMENTOS:",
                error
            );


            div.innerHTML = `
                <div class="erro">
                    ❌ Erro ao carregar orçamentos.
                    <br><br>
                    ${error.message}
                </div>
            `;


            return;

        }


        if (
            !lista ||
            lista.length === 0
        ) {

            div.innerHTML =
                "Nenhum orçamento cadastrado.";

            return;

        }


        div.innerHTML = "";


        for (
            const item of lista
        ) {

            let nomeCliente =
                "Cliente";


            let nomeMoto =
                "Moto";


            let placaMoto =
                "";


            /* ==========================
               BUSCAR CLIENTE
            ========================== */

            if (
                ehUUID(item.cliente_id)
            ) {

                const {
                    data: clientes
                } =
                    await supabaseClient
                    .from("clientes_nova")
                    .select(
                        "nome"
                    )
                    .eq(
                        "id",
                        item.cliente_id
                    )
                    .limit(1);


                if (
                    clientes &&
                    clientes.length
                ) {

                    nomeCliente =
                        clientes[0].nome ||
                        "Cliente";

                }

            }


            /* ==========================
               BUSCAR MOTO
            ========================== */

            if (
                ehUUID(item.moto_id)
            ) {

                const {
                    data: motos
                } =
                    await supabaseClient
                    .from("motos")
                    .select(
                        "marca,modelo,placa"
                    )
                    .eq(
                        "id",
                        item.moto_id
                    )
                    .limit(1);


                if (
                    motos &&
                    motos.length
                ) {

                    nomeMoto =
                        (
                            motos[0].marca ||
                            ""
                        ) +
                        " " +
                        (
                            motos[0].modelo ||
                            ""
                        );


                    placaMoto =
                        motos[0].placa ||
                        "";

                }

            }


            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "orcamento-item";


            bloco.innerHTML = `

                <h3>
                    📋 Orçamento nº
                    ${item.numero}
                </h3>

                <strong>
                    👤 ${nomeCliente}
                </strong>

                <br><br>

                🏍️ ${nomeMoto}

                ${
                    placaMoto
                    ? " - " + placaMoto
                    : ""
                }

                <br><br>

                🔧 <strong>Serviço:</strong>
                ${item.servico || "Não informado"}

                <br><br>

                💰 <strong>Total:</strong>
                ${formatarMoeda(item.total)}

                <br><br>

                <span class="status">
                    ${item.status || "Pendente"}
                </span>

            `;


            const acoes =
                document.createElement(
                    "div"
                );


            acoes.className =
                "acoes";


            if (
                item.status ===
                "Pendente"
            ) {

                const botao =
                    document.createElement(
                        "button"
                    );


                botao.type =
                    "button";


                botao.className =
                    "botao botao-aprovar";


                botao.innerText =
                    "✅ Aprovar orçamento";


                botao.onclick =
                    function() {

                        aprovarOrcamentoSalvo(
                            item.id
                        );

                    };


                acoes.appendChild(
                    botao
                );

            }


            if (
                item.status ===
                "Aprovado"
            ) {

                const botao =
                    document.createElement(
                        "button"
                    );


                botao.type =
                    "button";


                botao.className =
                    "botao botao-os";


                botao.innerText =
                    "🔧 Transformar em OS";


                botao.onclick =
                    function() {

                        transformarOrcamentoSalvoEmOS(
                            item.id
                        );

                    };


                acoes.appendChild(
                    botao
                );

            }


            bloco.appendChild(
                acoes
            );


            div.appendChild(
                bloco
            );

        }


    } catch (erro) {

        console.error(
            "ERRO GERAL:",
            erro
        );


        div.innerHTML = `
            <div class="erro">
                ❌ Erro ao carregar orçamentos.
                <br><br>
                ${erro.message || erro}
            </div>
        `;

    }

}


/* ==========================================
   APROVAR SALVO
========================================== */

async function aprovarOrcamentoSalvo(id) {

    if (!ehUUID(id)) {

        alert(
            "❌ ID do orçamento inválido."
        );

        return;

    }


    const confirmar =
        confirm(
            "Deseja aprovar este orçamento?"
        );


    if (!confirmar) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("orcamentos")
        .update({
            status: "Aprovado"
        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "❌ Erro ao aprovar orçamento.\n\n" +
            error.message
        );

        return;

    }


    alert(
        "✅ Orçamento aprovado com sucesso!"
    );


    mostrarOrcamentos();

}


/* ==========================================
   TRANSFORMAR EM OS
========================================== */

async function transformarEmOS() {

    const numero =
        document.getElementById(
            "numero"
        ).value;


    if (!numero) {

        alert(
            "⚠️ Número do orçamento não encontrado."
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("orcamentos")
        .select("*")
        .eq(
            "numero",
            numero
        )
        .limit(1);


    if (error) {

        alert(
            "❌ Erro ao buscar orçamento.\n\n" +
            error.message
        );

        return;

    }


    if (
        !data ||
        !data.length
    ) {

        alert(
            "⚠️ Salve o orçamento primeiro."
        );

        return;

    }


    const orcamento =
        data[0];


    if (
        orcamento.status !==
        "Aprovado"
    ) {

        alert(
            "⚠️ O orçamento precisa estar aprovado antes de virar uma Ordem de Serviço."
        );

        return;

    }


    localStorage.setItem(
        "dadosOrcamentoParaOS",
        JSON.stringify(
            orcamento
        )
    );


    window.location.href =
        "ordem-servico.html";

}

/* ==========================================
   WHATSAPP
========================================== */

function enviarWhatsApp() {

    const telefone =
        document.getElementById(
            "telefone"
        ).value;


    if (!telefone) {

        alert(
            "⚠️ O cliente não possui telefone/WhatsApp cadastrado."
        );

        return;

    }


    const clienteSelect =
        document.getElementById(
            "cliente"
        );


    const motoSelect =
        document.getElementById(
            "moto"
        );


    if (
        !clienteSelect.value ||
        !motoSelect.value
    ) {

        alert(
            "⚠️ Selecione o cliente e a moto."
        );

        return;

    }


    const cliente =
        clienteSelect.options[
            clienteSelect.selectedIndex
        ].text;


    const moto =
        motoSelect.options[
            motoSelect.selectedIndex
        ].text;


    const servico =
        document.getElementById(
            "servico"
        ).value;


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    const numero =
        document.getElementById(
            "numero"
        ).value;


    const mensagem =

        "Olá, " +
        cliente +
        "! 👋\n\n" +

        "Aqui é da DANIEL RB MOTOS.\n\n" +

        "📋 *ORÇAMENTO Nº " +
        numero +
        "*\n\n" +

        "🏍️ Moto: " +
        moto +
        "\n" +

        "🔧 Serviço: " +
        servico +
        "\n\n" +

        "💰 Mão de obra: " +
        formatarMoeda(mao) +
        "\n" +

        "🔩 Peças: " +
        formatarMoeda(pecas) +
        "\n\n" +

        "💵 *TOTAL: " +
        formatarMoeda(total) +
        "*\n\n" +

        "Aguardamos sua aprovação. 😊";


    let numeroWhatsApp =
        telefone.replace(
            /\D/g,
            ""
        );


    if (
        numeroWhatsApp.length === 10 ||
        numeroWhatsApp.length === 11
    ) {

        numeroWhatsApp =
            "55" +
            numeroWhatsApp;

    }


    window.open(
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        encodeURIComponent(
            mensagem
        ),
        "_blank"
    );

}


/* ==========================================
   FORMATAR MOEDA
========================================== */

function formatarMoeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}
