<style>

.carregando {

@media (max-width: 500px) {

Pendente

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let orcamentoAtual = null;


/* =====================================================
   GERAR NÚMERO
===================================================== */

function gerarNumero() {

    const numero =
        Date.now()
        .toString()
        .slice(-6);

    document.getElementById("numero").value =
        numero;

}


/* =====================================================
   VERIFICAR UUID
===================================================== */

function isUUID(valor) {

    if (!valor) {
        return false;
    }

    const texto =
        String(valor).trim();

    const regex =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    return regex.test(texto);

}


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes() {

    const select =
        document.getElementById("cliente");

    select.innerHTML =
        `<option value="">Carregando clientes...</option>`;

    try {

        const {
            data: clientes,
            error
        } =
        await supabaseClient
        .from("clientes_nova")
        .select("id,nome,cpf,telefone")
        .order("nome", {
            ascending: true
        });


        if (error) {

            console.error(
                "ERRO AO CARREGAR CLIENTES:",
                error
            );

            select.innerHTML =
                `<option value="">
                    Erro ao carregar clientes
                </option>`;

            document.getElementById("lista").innerHTML =
                `<div class="erro">
                    ❌ Erro ao carregar clientes.
                    <br><br>
                    ${error.message}
                </div>`;

            return;
        }


        select.innerHTML =
            `<option value="">
                Selecione o cliente
            </option>`;


        if (!clientes || clientes.length === 0) {

            select.innerHTML =
                `<option value="">
                    Nenhum cliente cadastrado
                </option>`;

            return;

        }


        clientes.forEach(function(cliente) {

            if (!isUUID(cliente.id)) {
                return;
            }

            const option =
                document.createElement("option");

            option.value =
                cliente.id;

            option.textContent =
                cliente.nome ||
                "Cliente sem nome";

            option.dataset.telefone =
                cliente.telefone || "";

            select.appendChild(option);

        });


    } catch (erro) {

        console.error(
            "ERRO GERAL CLIENTES:",
            erro
        );

        select.innerHTML =
            `<option value="">
                Erro ao carregar clientes
            </option>`;

    }

}


/* =====================================================
   CARREGAR MOTOS DO CLIENTE
===================================================== */

async function carregarMotosDoCliente() {

    const clienteId =
        document.getElementById("cliente").value;

    const selectMoto =
        document.getElementById("moto");

    const telefone =
        document.getElementById("telefone");

    const placa =
        document.getElementById("placa");


    selectMoto.innerHTML =
        `<option value="">
            Carregando motos...
        </option>`;

    telefone.value = "";
    placa.value = "";


    if (!clienteId) {

        selectMoto.innerHTML =
            `<option value="">
                Selecione primeiro o cliente
            </option>`;

        return;

    }


    /* PROTEÇÃO UUID */

    if (!isUUID(clienteId)) {

        selectMoto.innerHTML =
            `<option value="">
                ID do cliente inválido
            </option>`;

        alert(
            "❌ O ID do cliente selecionado não é um UUID válido."
        );

        return;

    }


    /* TELEFONE */

    const opcaoCliente =
        document.getElementById("cliente")
        .options[
            document.getElementById("cliente")
            .selectedIndex
        ];

    telefone.value =
        opcaoCliente.dataset.telefone || "";


    try {

        const {
            data: motos,
            error
        } =
        await supabaseClient
        .from("motos")
        .select(
            "id,cliente_id,marca,modelo,placa,ano,km"
        )
        .eq(
            "cliente_id",
            clienteId
        )
        .order(
            "marca",
            {
                ascending: true
            }
        );


        if (error) {

            console.error(
                "ERRO AO CARREGAR MOTOS:",
                error
            );

            selectMoto.innerHTML =
                `<option value="">
                    Erro ao carregar motos
                </option>`;

            alert(
                "❌ Erro ao carregar motos.\n\n" +
                error.message
            );

            return;

        }


        selectMoto.innerHTML =
            `<option value="">
                Selecione a moto
            </option>`;


        if (!motos || motos.length === 0) {

            selectMoto.innerHTML =
                `<option value="">
                    Nenhuma moto cadastrada
                </option>`;

            return;

        }


        motos.forEach(function(moto) {

            if (!isUUID(moto.id)) {
                return;
            }

            const option =
                document.createElement("option");

            option.value =
                moto.id;

            option.textContent =
                (
                    moto.marca || ""
                ) +
                " " +
                (
                    moto.modelo || "Moto"
                ) +
                " - " +
                (
                    moto.placa || "Sem placa"
                );

            option.dataset.placa =
                moto.placa || "";

            option.dataset.marca =
                moto.marca || "";

            option.dataset.modelo =
                moto.modelo || "";

            option.dataset.ano =
                moto.ano || "";

            option.dataset.km =
                moto.km || "";

            selectMoto.appendChild(
                option
            );

        });


    } catch (erro) {

        console.error(
            "ERRO GERAL MOTOS:",
            erro
        );

        selectMoto.innerHTML =
            `<option value="">
                Erro ao carregar motos
            </option>`;

    }

}


/* =====================================================
   PREENCHER MOTO
===================================================== */

function preencherMoto() {

    const select =
        document.getElementById("moto");

    const opcao =
        select.options[
            select.selectedIndex
        ];

    if (!opcao) {

        document.getElementById(
            "placa"
        ).value = "";

        return;

    }


    document.getElementById(
        "placa"
    ).value =
        opcao.dataset.placa || "";

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotal() {

    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    document.getElementById(
        "total"
    ).textContent =
        formatarMoeda(total);

}


/* =====================================================
   PEGAR DADOS DO FORMULÁRIO
===================================================== */

function pegarDadosFormulario() {

    const clienteSelect =
        document.getElementById("cliente");

    const motoSelect =
        document.getElementById("moto");


    const clienteId =
        clienteSelect.value;

    const motoId =
        motoSelect.value;


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const opcaoCliente =
        clienteSelect.options[
            clienteSelect.selectedIndex
        ];


    const opcaoMoto =
        motoSelect.options[
            motoSelect.selectedIndex
        ];


    return {

        cliente_id:
            clienteId,

        moto_id:
            motoId,

        numero:
            document.getElementById(
                "numero"
            ).value,

        servico:
            document.getElementById(
                "servico"
            ).value.trim(),

        diagnostico:
            document.getElementById(
                "diagnostico"
            ).value.trim(),

        mao_de_obra:
            mao,

        pecas:
            pecas,

        total:
            mao + pecas,

        validade:
            document.getElementById(
                "validade"
            ).value || null,

        status:
            document.getElementById(
                "status"
            ).value,

        clienteNome:
            opcaoCliente
            ? opcaoCliente.textContent
            : "",

        telefone:
            document.getElementById(
                "telefone"
            ).value,

        motoNome:
            opcaoMoto
            ? opcaoMoto.textContent
            : "",

        placa:
            document.getElementById(
                "placa"
            ).value

    };

}


/* =====================================================
   SALVAR ORÇAMENTO
===================================================== */

async function salvarOrcamento() {

    const btn =
        document.getElementById("btnSalvar");


    const dados =
        pegarDadosFormulario();


    /* VALIDAR CLIENTE */

    if (!dados.cliente_id) {

        alert(
            "⚠️ Selecione o cliente."
        );

        return;

    }


    /* VALIDAR UUID CLIENTE */

    if (!isUUID(dados.cliente_id)) {

        alert(
            "❌ O ID do cliente não é um UUID válido."
        );

        return;

    }


    /* VALIDAR MOTO */

    if (!dados.moto_id) {

        alert(
            "⚠️ Selecione a moto."
        );

        return;

    }


    /* VALIDAR UUID MOTO */

    if (!isUUID(dados.moto_id)) {

        alert(
            "❌ O ID da moto não é um UUID válido."
        );

        return;

    }


    if (!dados.servico) {

        alert(
            "⚠️ Informe o serviço solicitado."
        );

        return;

    }


    btn.disabled = true;
    btn.innerText =
        "💾 Salvando...";


    try {

        const registro = {

            cliente_id:
                dados.cliente_id,

            moto_id:
                dados.moto_id,

            numero:
                dados.numero,

            servico:
                dados.servico,

            diagnostico:
                dados.diagnostico || null,

            mao_de_obra:
                dados.mao_de_obra,

            pecas:
                dados.pecas,

            total:
                dados.total,

            validade:
                dados.validade,

            status:
                dados.status

        };


        console.log(
            "DADOS ENVIADOS:",
            registro
        );


        const {
            data,
            error
        } =
        await supabaseClient
        .from("orcamentos")
        .insert([
            registro
        ])
        .select()
        .single();


        if (error) {

            console.error(
                "ERRO AO SALVAR:",
                error
            );

            alert(
                "❌ Erro ao salvar orçamento.\n\n" +
                error.message
            );

            return;

        }


        orcamentoAtual =
            data;


        alert(
            "✅ Orçamento nº " +
            dados.numero +
            " salvo com sucesso!"
        );


        mostrarOrcamentos();


    } catch (erro) {

        console.error(
            "ERRO GERAL:",
            erro
        );

        alert(
            "❌ Erro ao salvar orçamento.\n\n" +
            (
                erro.message ||
                erro
            )
        );


    } finally {

        btn.disabled = false;

        btn.innerText =
            "💾 Salvar Orçamento";

    }

}


/* =====================================================
   CARREGAR ORÇAMENTOS
===================================================== */

async function mostrarOrcamentos() {

    const div =
        document.getElementById("lista");


    div.innerHTML =
        `<div class="carregando">
            🔄 Carregando orçamentos...
        </div>`;


    try {

        const {
            data: lista,
            error
        } =
        await supabaseClient
        .from("orcamentos")
        .select(
            `
            id,
            created_at,
            cliente_id,
            moto_id,
            numero,
            servico,
            diagnostico,
            mao_de_obra,
            pecas,
            total,
            validade,
            status
            `
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


        if (error) {

            console.error(
                "ERRO ORÇAMENTOS:",
                error
            );

            div.innerHTML =
                `<div class="erro">
                    ❌ Erro ao carregar orçamentos.
                    <br><br>
                    ${error.message}
                </div>`;

            return;

        }


        if (!lista || lista.length === 0) {

            div.innerHTML =
                "Nenhum orçamento cadastrado.";

            return;

        }


        div.innerHTML = "";


        for (
            const item of lista
        ) {

            const bloco =
                document.createElement(
                    "div"
                );

            bloco.className =
                "orcamento-item";


            bloco.innerHTML =

                "<h3>" +
                "Orçamento nº " +
                (item.numero || "") +
                "</h3>" +

                "<p>" +
                "<strong>Serviço:</strong> " +
                (item.servico || "") +
                "</p>" +

                "<p>" +
                "<strong>Diagnóstico:</strong><br>" +
                (item.diagnostico || "Não informado") +
                "</p>" +

                "<span class='status'>" +
                (item.status || "Pendente") +
                "</span>" +

                "<p>" +
                "<strong>Mão de obra:</strong> " +
                formatarMoeda(
                    item.mao_de_obra
                ) +
                "</p>" +

                "<p>" +
                "<strong>Peças:</strong> " +
                formatarMoeda(
                    item.pecas
                ) +
                "</p>" +

                "<p>" +
                "<strong>Total:</strong> " +
                formatarMoeda(
                    item.total
                ) +
                "</p>" +

                "<div class='acoes'>" +

                (
                    item.status === "Pendente"

                    ?

                    "<button " +
                    "type='button' " +
                    "class='botao botao-aprovar' " +
                    "onclick='aprovarOrcamentoSalvo(\"" +
                    item.id +
                    "\")'>" +
                    "✅ Aprovar orçamento" +
                    "</button>"

                    :

                    ""
                ) +

                (
                    item.status === "Aprovado"

                    ?

                    "<button " +
                    "type='button' " +
                    "class='botao botao-os' " +
                    "onclick='transformarOrcamentoSalvoEmOS(\"" +
                    item.id +
                    "\")'>" +
                    "🔧 Transformar em OS" +
                    "</button>"

                    :

                    ""
                ) +

                "</div>";


            div.appendChild(
                bloco
            );

        }


    } catch (erro) {

        console.error(
            erro
        );

        div.innerHTML =
            `<div class="erro">
                ❌ Erro ao carregar os orçamentos.
                <br><br>
                ${erro.message || erro}
            </div>`;

    }

}


/* =====================================================
   APROVAR ORÇAMENTO
===================================================== */

async function aprovarOrcamento() {

    if (
        !orcamentoAtual
    ) {

        alert(
            "⚠️ Salve o orçamento primeiro."
        );

        return;

    }


    if (!isUUID(orcamentoAtual.id)) {

        alert(
            "❌ ID do orçamento inválido."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("orcamentos")
    .update({
        status: "Aprovado"
    })
    .eq(
        "id",
        orcamentoAtual.id
    );


    if (error) {

        alert(
            "❌ Erro ao aprovar.\n\n" +
            error.message
        );

        return;

    }


    document.getElementById(
        "status"
    ).value =
        "Aprovado";


    orcamentoAtual.status =
        "Aprovado";


    await mostrarOrcamentos();


    alert(
        "✅ Orçamento aprovado com sucesso!"
    );

}


/* =====================================================
   APROVAR ORÇAMENTO SALVO
===================================================== */

async function aprovarOrcamentoSalvo(id) {

    if (!isUUID(id)) {

        alert(
            "❌ ID do orçamento inválido."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("orcamentos")
    .update({
        status: "Aprovado"
    })
    .eq(
        "id",
        id
    );


    if (error) {

        alert(
            "❌ Erro ao aprovar orçamento.\n\n" +
            error.message
        );

        return;

    }


    await mostrarOrcamentos();


    alert(
        "✅ Orçamento aprovado com sucesso!"
    );

}


/* =====================================================
   TRANSFORMAR EM OS
===================================================== */

function transformarEmOS() {

    if (!orcamentoAtual) {

        alert(
            "⚠️ Salve o orçamento primeiro."
        );

        return;

    }


    if (
        !isUUID(orcamentoAtual.cliente_id)
    ) {

        alert(
            "❌ ID do cliente inválido."
        );

        return;

    }


    if (
        !isUUID(orcamentoAtual.moto_id)
    ) {

        alert(
            "❌ ID da moto inválido."
        );

        return;

    }


    localStorage.setItem(
        "dadosOrcamentoParaOS",
        JSON.stringify(
            orcamentoAtual
        )
    );


    window.location.href =
        "ordem-servico.html";

}


/* =====================================================
   TRANSFORMAR ORÇAMENTO SALVO EM OS
===================================================== */

async function transformarOrcamentoSalvoEmOS(id) {

    if (!isUUID(id)) {

        alert(
            "❌ ID do orçamento inválido."
        );

        return;

    }


    const {
        data: orcamento,
        error
    } =
    await supabaseClient
    .from("orcamentos")
    .select("*")
    .eq(
        "id",
        id
    )
    .single();


    if (error || !orcamento) {

        alert(
            "❌ Não foi possível carregar o orçamento.\n\n" +
            (
                error
                ? error.message
                : ""
            )
        );

        return;

    }


    if (
        orcamento.status !==
        "Aprovado"
    ) {

        alert(
            "⚠️ O orçamento precisa estar aprovado antes de virar uma Ordem de Serviço."
        );

        return;

    }


    if (
        !isUUID(
            orcamento.cliente_id
        )
    ) {

        alert(
            "❌ O cliente deste orçamento possui um ID inválido."
        );

        return;

    }


    if (
        !isUUID(
            orcamento.moto_id
        )
    ) {

        alert(
            "❌ A moto deste orçamento possui um ID inválido."
        );

        return;

    }


    localStorage.setItem(
        "dadosOrcamentoParaOS",
        JSON.stringify(
            orcamento
        )
    );


    window.location.href =
        "ordem-servico.html";

}


/* =====================================================
   WHATSAPP
===================================================== */

function enviarWhatsApp() {

    const telefone =
        document.getElementById(
            "telefone"
        ).value;


    if (!telefone) {

        alert(
            "⚠️ O cliente não possui telefone cadastrado."
        );

        return;

    }


    const clienteSelect =
        document.getElementById(
            "cliente"
        );


    const motoSelect =
        document.getElementById(
            "moto"
        );


    if (
        !clienteSelect.value ||
        !motoSelect.value
    ) {

        alert(
            "⚠️ Selecione o cliente e a moto."
        );

        return;

    }


    const cliente =
        clienteSelect.options[
            clienteSelect.selectedIndex
        ].text;


    const moto =
        motoSelect.options[
            motoSelect.selectedIndex
        ].text;


    const servico =
        document.getElementById(
            "servico"
        ).value;


    const mao =
        parseFloat(
            document.getElementById(
                "maoDeObra"
            ).value
        ) || 0;


    const pecas =
        parseFloat(
            document.getElementById(
                "pecas"
            ).value
        ) || 0;


    const total =
        mao + pecas;


    const mensagem =

        "Olá, " +
        cliente +
        "! 👋\n\n" +

        "Aqui é da DANIEL RB MOTOS.\n\n" +

        "📋 *ORÇAMENTO Nº " +
        document.getElementById(
            "numero"
        ).value +
        "*\n\n" +

        "🏍️ Moto: " +
        moto +
        "\n" +

        "🔧 Serviço: " +
        servico +
        "\n\n" +

        "💰 Mão de obra: " +
        formatarMoeda(mao) +
        "\n" +

        "🔩 Peças: " +
        formatarMoeda(pecas) +
        "\n\n" +

        "💵 *TOTAL: " +
        formatarMoeda(total) +
        "*\n\n" +

        "Aguardamos sua aprovação. 😊";


    let numero =
        telefone.replace(
            /\D/g,
            ""
        );


    if (
        numero.length === 10 ||
        numero.length === 11
    ) {

        numero =
            "55" +
            numero;

    }


    window.open(
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(
            mensagem
        ),
        "_blank"
    );

}


/* =====================================================
   MOEDA
===================================================== */

function formatarMoeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =====================================================
   DATA
===================================================== */

function definirValidade() {

    const hoje =
        new Date();

    hoje.setDate(
        hoje.getDate() + 7
    );


    const ano =
        hoje.getFullYear();

    const mes =
        String(
            hoje.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const dia =
        String(
            hoje.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "validade"
    ).value =
        ano +
        "-" +
        mes +
        "-" +
        dia;

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

gerarNumero();

definirValidade();

carregarClientes();

mostrarOrcamentos();
