<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY

/* =====================================================
   VARIÁVEIS
===================================================== */

let agendamentoAtual = null;

let motoAtual = null;

let clienteAtual = null;


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    sucesso = true
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );

    elemento.textContent =
        texto;

    elemento.className =
        "mensagem " +
        (
            sucesso
                ? "sucesso"
                : "erro-msg"
        );

    elemento.style.display =
        "block";


    setTimeout(
        function() {

            elemento.style.display =
                "none";

        },
        4000
    );

}


/* =====================================================
   NÚMERO
===================================================== */

function numero(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return 0;

    }


    const n =
        parseFloat(
            String(valor)
                .replace(",", ".")
        );


    return isNaN(n)
        ? 0
        : n;

}


/* =====================================================
   MOEDA
===================================================== */

function formatarMoeda(valor) {

    return numero(valor)
        .toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

}


/* =====================================================
   TOTAL
===================================================== */

function calcularTotal() {

    const campoPecas =
        document.getElementById(
            "valorPecas"
        );

    const campoMaoObra =
        document.getElementById(
            "valorMaoObra"
        );

    const campoDesconto =
        document.getElementById(
            "desconto"
        );

    const campoTotal =
        document.getElementById(
            "valorTotal"
        );


    if (
        !campoPecas ||
        !campoMaoObra ||
        !campoDesconto ||
        !campoTotal
    ) {

        return 0;

    }


    const pecas =
        numero(
            campoPecas.value
        );

    const maoObra =
        numero(
            campoMaoObra.value
        );

    const desconto =
        numero(
            campoDesconto.value
        );


    const total =
        Math.max(
            0,
            pecas +
            maoObra -
            desconto
        );


    campoTotal.textContent =
        formatarMoeda(
            total
        );


    return total;

}


/* =====================================================
   MOSTRAR ERRO
===================================================== */

function mostrarErro(
    titulo,
    detalhe = ""
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    conteudo.innerHTML = `

        <div class="erro">

            ❌ ${escaparHTML(titulo)}

            ${

                ? `
                    <br><br>
                    <small>
                        ${escaparHTML(detalhe)}

                  `
                : ""
            }

        <a
            href="agendamentos.html"
            class="voltar"
        >

            ← Voltar para Agendamentos

        </a>

    `;

}


/* =====================================================
   CARREGAR AGENDAMENTO
===================================================== */

async function carregarAgendamento() {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    const salvo =
        localStorage.getItem(
            "agendamentoParaOS"
        );


    if (!salvo) {

        mostrarErro(
            "Nenhum agendamento foi selecionado.",
            "Volte para Agendamentos e clique em Abrir OS."
        );

        return;

    }


    try {

        agendamentoAtual =
            JSON.parse(
                salvo
            );

    }

    catch (erro) {

        mostrarErro(
            "Não foi possível ler o agendamento.",
            erro.message
        );

        return;

    }


    if (
        !agendamentoAtual ||
        !agendamentoAtual.id
    ) {

        mostrarErro(
            "O agendamento selecionado está incompleto.",
            "O ID do agendamento não foi encontrado."
        );

        return;

    }


    const motoId =
        agendamentoAtual.moto_id;


    if (!motoId) {

        mostrarErro(
            "Este agendamento não possui uma moto vinculada."
        );

        return;

    }


    try {

        /* =============================================
           BUSCAR MOTO
        ============================================= */

        const respostaMoto =
            await supabaseClient
                .from("motos")
                .select("*")
                .eq(
                    "id",
                    motoId
                )
                .maybeSingle();


        if (
            respostaMoto.error
        ) {

            mostrarErro(
                "Erro ao buscar a moto.",
                respostaMoto.error.message
            );

            return;

        }


        if (
            !respostaMoto.data
        ) {

            mostrarErro(
                "Moto não encontrada.",
                "A moto vinculada ao agendamento não existe mais no banco."
            );

            return;

        }


        motoAtual =
            respostaMoto.data;


        /* =============================================
           BUSCAR CLIENTE
        ============================================= */

        clienteAtual = {};


        if (
            motoAtual.cliente_id
        ) {

            const respostaCliente =
                await supabaseClient
                    .from("clientes_nova")
                    .select("*")
                    .eq(
                        "id",
                        motoAtual.cliente_id
                    )
                    .maybeSingle();


            if (
                respostaCliente.error
            ) {

                console.warn(
                    "Cliente não carregado:",
                    respostaCliente.error
                );

            }

            else {

                clienteAtual =
                    respostaCliente.data || {};

            }

        }


        montarTela(
            clienteAtual,
            motoAtual
        );

    }

    catch (erro) {

        console.error(
            "Erro ao carregar OS:",
            erro
        );


        mostrarErro(
            "Erro ao carregar a Ordem de Serviço.",
            erro.message || String(erro)
        );

    }

}

/* =====================================================
   SALVAR ORDEM DE SERVIÇO
===================================================== */

async function salvarOS() {

    const botao =
        document.getElementById(
            "botaoSalvar"
        );


    if (!botao) {

        return;

    }


    if (!agendamentoAtual) {

        mostrarMensagem(
            "❌ Agendamento não carregado.",
            false
        );

        return;

    }


    if (!motoAtual) {

        mostrarMensagem(
            "❌ Moto não carregada.",
            false
        );

        return;

    }


    if (botao.disabled) {

        return;

    }


    botao.disabled = true;

    botao.textContent =
        "⏳ Salvando...";


    try {

        /* =============================================
           PEGAR VALORES
        ============================================= */

        const valorPecas =
            numero(
                document.getElementById(
                    "valorPecas"
                ).value
            );


        const valorMaoObra =
            numero(
                document.getElementById(
                    "valorMaoObra"
                ).value
            );


        const desconto =
            numero(
                document.getElementById(
                    "desconto"
                ).value
            );


        const valorTotal =
            Math.max(
                0,
                valorPecas +
                valorMaoObra -
                desconto
            );


        /* =============================================
           MONTAR DADOS
        ============================================= */

        const dados = {

            cliente_id:
                motoAtual.cliente_id || null,

            moto_id:
                motoAtual.id,

            agendamento_id:
                agendamentoAtual.id,

            data_entrada:
                new Date()
                    .toISOString()
                    .slice(0, 10),

            problema_relatado:
                document.getElementById(
                    "problema"
                ).value.trim(),

            diagnostico:
                document.getElementById(
                    "diagnostico"
                ).value.trim(),

            servicos_realizados:
                document.getElementById(
                    "servicos"
                ).value.trim(),

            pecas_utilizadas:
                document.getElementById(
                    "pecas"
                ).value.trim(),

            valor_pecas:
                valorPecas,

            valor_mao_obra:
                valorMaoObra,

            desconto:
                desconto,

            valor_total:
                valorTotal,

            forma_pagamento:
                document.getElementById(
                    "formaPagamento"
                ).value || null,

            status:
                document.getElementById(
                    "status"
                ).value,

            observacoes:
                document.getElementById(
                    "observacoes"
                ).value.trim()

        };


        console.log(
            "Enviando OS:",
            dados
        );


        /* =============================================
           SALVAR SOMENTE NA TABELA ordens_servico
           
           NÃO ATUALIZA MAIS agendamentos AQUI.
           
           Isso é proposital.
           
           Se a tabela agendamentos tiver RLS,
           trigger, problema de permissão ou qualquer
           outra coisa que faça a requisição travar,
           isso NÃO vai mais afetar o salvamento da OS.
        ============================================= */

        const resposta =
            await supabaseClient
                .from("ordens_servico")
                .insert(dados);


        console.log(
            "Resposta do INSERT:",
            resposta
        );


        /* =============================================
           SE DEU ERRO
        ============================================= */

        if (resposta.error) {

            console.error(
                "ERRO AO SALVAR OS:",
                resposta.error
            );


            mostrarMensagem(
                "❌ Erro ao salvar: " +
                resposta.error.message,
                false
            );


            botao.disabled = false;

            botao.textContent =
                "💾 Salvar Ordem de Serviço";

            return;

        }


        /* =============================================
           SALVOU
        ============================================= */

        try {

            localStorage.setItem(
                "ordemServicoAtual",
                JSON.stringify(
                    dados
                )
            );

        }

        catch (erroLocal) {

            console.warn(
                "Erro no localStorage:",
                erroLocal
            );

        }


        /* =============================================
           IMPORTANTE:
           
           AQUI NÃO TEMOS MAIS:

           .from("agendamentos")
           .update(...)
           .eq(...)

           Portanto o salvamento termina aqui.
        ============================================= */


        mostrarMensagem(
            "✅ Ordem de Serviço salva com sucesso!",
            true
        );


        botao.textContent =
            "✅ OS Salva";


        botao.disabled = true;


    }

    catch (erro) {

        console.error(
            "ERRO INESPERADO:",
            erro
        );


        mostrarMensagem(
            "❌ Erro ao salvar a OS: " +
            (
                erro.message ||
                String(erro)
            ),
            false
        );


        botao.disabled = false;

        botao.textContent =
            "💾 Salvar Ordem de Serviço";

    }

}


/* =====================================================
   INICIAR
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        carregarAgendamento();

    }
);

</script>
