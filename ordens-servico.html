<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://niffgrhjmnizvusnrqyg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIÁVEIS
===================================================== */

let ordens = [];

let clientes = {};

let motos = {};

let osVisualizacao = null;


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   MOEDA
===================================================== */

function numero(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return 0;

    }


    let texto =
        String(valor)
            .trim();


    if (
        texto.includes(",") &&
        texto.includes(".")
    ) {

        texto =
            texto.replace(
                /\./g,
                ""
            );

        texto =
            texto.replace(
                ",",
                "."
            );

    }

    else if (
        texto.includes(",")
    ) {

        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const n =
        parseFloat(
            texto
        );


    return isNaN(n)
        ? 0
        : n;

}


function moeda(valor) {

    return numero(valor)
        .toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

}


/* =====================================================
   DATA
===================================================== */

function formatarData(data) {

    if (!data) {

        return "Não informada";

    }


    const texto =
        String(data);


    const somenteData =
        texto.split("T")[0];


    const partes =
        somenteData.split("-");


    if (
        partes.length === 3
    ) {

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   STATUS
===================================================== */

function classeStatus(status) {

    const valor =
        String(status || "")
            .trim()
            .toLowerCase();


    if (
        valor === "em serviço" ||
        valor === "em servico"
    ) {

        return "status-servico";

    }


    if (
        valor === "pronta" ||
        valor === "pronto"
    ) {

        return "status-pronta";

    }


    if (
        valor === "entregue"
    ) {

        return "status-entregue";

    }


    if (
        valor === "cancelada" ||
        valor === "cancelado"
    ) {

        return "status-cancelada";

    }


    return "status-aberta";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    sucesso = true
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            sucesso
            ? "sucesso"
            : "erro-msg"
        );


    elemento.style.display =
        "block";


    clearTimeout(
        mostrarMensagem.timer
    );


    mostrarMensagem.timer =
        setTimeout(
            function() {

                elemento.style.display =
                    "none";

            },
            3500
        );

}


/* =====================================================
   CARREGAR OS
===================================================== */

async function carregarOS() {

    const lista =
        document.getElementById(
            "listaOS"
        );


    lista.innerHTML = `

        <div class="carregando">

            🔄 Carregando ordens de serviço...

        </div>

    `;


    try {

        const resposta =
            await supabaseClient
                .from("ordens_servico")
                .select("*")
                .order(
                    "id",
                    {
                        ascending: false
                    }
                );


        if (
            resposta.error
        ) {

            console.error(
                "Erro ao carregar OS:",
                resposta.error
            );


            lista.innerHTML = `

                <div class="erro">

                    ❌ Erro ao carregar as Ordens de Serviço.

                    <br><br>

                    ${escaparHTML(
                        resposta.error.message
                    )}

                </div>

            `;

            return;

        }


        ordens =
            resposta.data || [];


        atualizarResumo(
            ordens
        );


        if (
            ordens.length === 0
        ) {

            clientes = {};

            motos = {};


            lista.innerHTML = `

                <div class="vazio">

                    <div class="vazio-icone">
                        🧾
                    </div>

                    <h3>
                        Nenhuma Ordem de Serviço
                    </h3>

                    <p>
                        As OS que você salvar aparecerão aqui.
                    </p>

                </div>

            `;

            return;

        }


        const clientesMap =
            await carregarClientes(
                ordens
            );


        const motosMap =
            await carregarMotos(
                ordens
            );


        clientes =
            clientesMap;


        motos =
            motosMap;


        montarLista(
            ordens,
            clientesMap,
            motosMap
        );

    }

    catch (erro) {

        console.error(
            "Erro inesperado:",
            erro
        );


        lista.innerHTML = `

            <div class="erro">

                ❌ Erro inesperado ao carregar as OS.

                <br><br>

                ${escaparHTML(
                    erro.message ||
                    String(erro)
                )}

            </div>

        `;

    }

}


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes(
    listaOS
) {

    const mapa = {};


    const ids =
        [
            ...new Set(
                listaOS
                    .map(
                        function(os) {

                            return os.cliente_id;

                        }
                    )
                    .filter(
                        function(id) {

                            return id !== null &&
                                   id !== undefined &&
                                   id !== "";

                        }
                    )
            )
        ];


    if (
        ids.length === 0
    ) {

        return mapa;

    }


    try {

        const resposta =
            await supabaseClient
                .from("clientes_nova")
                .select("*")
                .in(
                    "id",
                    ids
                );


        if (
            resposta.error
        ) {

            console.warn(
                "Erro ao carregar clientes:",
                resposta.error
            );

            return mapa;

        }


        (
            resposta.data || []
        )
        .forEach(
            function(cliente) {

                mapa[
                    String(cliente.id)
                ] =
                    cliente;

            }
        );

    }

    catch (erro) {

        console.warn(
            "Erro nos clientes:",
            erro
        );

    }


    return mapa;

}


/* =====================================================
   CARREGAR MOTOS
===================================================== */

async function carregarMotos(
    listaOS
) {

    const mapa = {};


    const ids =
        [
            ...new Set(
                listaOS
                    .map(
                        function(os) {

                            return os.moto_id;

                        }
                    )
                    .filter(
                        function(id) {

                            return id !== null &&
                                   id !== undefined &&
                                   id !== "";

                        }
                    )
            )
        ];


    if (
        ids.length === 0
    ) {

        return mapa;

    }


    try {

        const resposta =
            await supabaseClient
                .from("motos")
                .select("*")
                .in(
                    "id",
                    ids
                );


        if (
            resposta.error
        ) {

            console.warn(
                "Erro ao carregar motos:",
                resposta.error
            );

            return mapa;

        }


        (
            resposta.data || []
        )
        .forEach(
            function(moto) {

                mapa[
                    String(moto.id)
                ] =
                    moto;

            }
        );

    }

    catch (erro) {

        console.warn(
            "Erro nas motos:",
            erro
        );

    }


    return mapa;

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(
    lista
) {

    let emServico = 0;

    let prontas = 0;

    let totalValor = 0;


    lista.forEach(
        function(os) {

            const status =
                String(
                    os.status || ""
                )
                .trim()
                .toLowerCase();


            if (
                status === "em serviço" ||
                status === "em servico"
            ) {

                emServico++;

            }


            if (
                status === "pronta" ||
                status === "pronto"
            ) {

                prontas++;

            }


            totalValor +=
                numero(
                    os.valor_total
                );

        }
    );


    document.getElementById(
        "totalOS"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalServico"
    ).textContent =
        emServico;


    document.getElementById(
        "totalPronta"
    ).textContent =
        prontas;


    document.getElementById(
        "valorTotal"
    ).textContent =
        moeda(
            totalValor
        );

}

/* =====================================================
   EXCLUIR OS PELO ID REAL
===================================================== */

async function excluirOSPorId(
    id
) {

    if (
        id === null ||
        id === undefined ||
        id === ""
    ) {

        mostrarMensagem(
            "❌ ID da OS não encontrado.",
            false
        );

        return;

    }


    /*
     * Procura a OS pelo ID real.
     */

    const os =
        ordens.find(
            function(item) {

                return String(item.id) === String(id);

            }
        );


    const numeroOS =
        os?.id ||
        id;


    /*
     * Confirmação.
     */

    const confirmar =
        confirm(
            "⚠️ ATENÇÃO!\n\n" +
            "Você realmente deseja excluir a OS #" +
            numeroOS +
            "?\n\n" +
            "Essa ação não poderá ser desfeita."
        );


    if (!confirmar) {

        return;

    }


    /*
     * Localiza o botão para impedir
     * vários cliques enquanto exclui.
     */

    const botoes =
        document.querySelectorAll(
            ".excluir"
        );


    botoes.forEach(
        function(botao) {

            if (
                String(
                    botao.dataset.osId
                ) === String(id)
            ) {

                botao.disabled = true;

                botao.textContent =
                    "⏳ Excluindo...";

            }

        }
    );


    try {

        mostrarMensagem(
            "⏳ Excluindo OS..."
        );


        /*
         * EXCLUSÃO PELO ID REAL.
         *
         * O .select() faz o Supabase
         * devolver a linha que foi excluída.
         *
         * Isso permite confirmar que
         * realmente houve exclusão.
         */

        const resposta =
            await supabaseClient
                .from("ordens_servico")
                .delete()
                .eq(
                    "id",
                    id
                )
                .select();


        /*
         * Verifica erro do Supabase.
         */

        if (
            resposta.error
        ) {

            console.error(
                "Erro ao excluir OS:",
                resposta.error
            );


            mostrarMensagem(
                "❌ Não foi possível excluir a OS.\n\n" +
                resposta.error.message,
                false
            );


            restaurarBotaoExcluir(
                id
            );


            return;

        }


        /*
         * Se não retornou nenhuma linha,
         * normalmente significa que o DELETE
         * não pôde afetar aquela linha.
         *
         * Isso pode acontecer por causa
         * das políticas RLS.
         */

        if (
            !resposta.data ||
            resposta.data.length === 0
        ) {

            console.warn(
                "Nenhuma linha foi excluída.",
                {
                    id: id,
                    resposta: resposta
                }
            );


            mostrarMensagem(
                "❌ A OS não foi excluída.\n\n" +
                "O Supabase provavelmente está bloqueando a exclusão por uma política de segurança (RLS).",
                false
            );


            restaurarBotaoExcluir(
                id
            );


            return;

        }


        /*
         * Remove imediatamente da lista
         * local.
         */

        ordens =
            ordens.filter(
                function(item) {

                    return String(item.id) !== String(id);

                }
            );


        /*
         * Se a OS excluída estava aberta
         * no modal, fecha o modal.
         */

        if (
            osVisualizacao &&
            String(
                osVisualizacao.id
            ) === String(id)
        ) {

            fecharModal();

            osVisualizacao =
                null;

        }


        /*
         * Atualiza os números do resumo.
         */

        atualizarResumo(
            ordens
        );


        /*
         * Reconstrói a lista.
         */

        montarLista(
            ordens,
            clientes,
            motos
        );


        /*
         * Confirma para o usuário.
         */

        mostrarMensagem(
            "✅ OS #" +
            numeroOS +
            " excluída com sucesso!"
        );

    }

    catch (erro) {

        console.error(
            "Erro inesperado ao excluir OS:",
            erro
        );


        mostrarMensagem(
            "❌ Erro inesperado ao excluir a OS.\n\n" +
            (
                erro.message ||
                String(erro)
            ),
            false
        );


        restaurarBotaoExcluir(
            id
        );

    }

}


/* =====================================================
   RESTAURAR BOTÃO EXCLUIR
===================================================== */

function restaurarBotaoExcluir(
    id
) {

    const botoes =
        document.querySelectorAll(
            ".excluir"
        );


    botoes.forEach(
        function(botao) {

            if (
                String(
                    botao.dataset.osId
                ) === String(id)
            ) {

                botao.disabled = false;

                botao.textContent =
                    "🗑️ Excluir";

            }

        }
    );

}


/* =====================================================
   COMPATIBILIDADE
===================================================== */

function excluirOS(
    indice
) {

    /*
     * Mantemos esta função para evitar
     * problemas caso alguma outra parte
     * do sistema ainda chame excluirOS().
     */

    const os =
        ordens[indice];


    if (!os) {

        mostrarMensagem(
            "❌ Ordem de Serviço não encontrada.",
            false
        );

        return;

    }


    excluirOSPorId(
        os.id
    );

}
