<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Solicitações - DANIEL RB MOTOS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at top,
            #3b3b3b 0%,
            #181818 48%,
            #080808 100%
        );
    color: #111;
    min-height: 100vh;
}

header {
    background:
        linear-gradient(
            135deg,
            #050505,
            #260000,
            #090909
        );

    color: white;
    padding: 25px 18px;

    text-align: center;

    border-bottom: 2px solid #8b0000;
}

.logo {
    font-size: 38px;
}

header h1 {
    margin: 5px 0;
    font-size: 26px;
}

header p {
    margin: 5px 0;
    color: #ccc;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px 40px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.topo h2 {
    color: white;
    margin: 0;
    font-size: 22px;
}

.atualizar {
    border: none;
    border-radius: 10px;
    background: #8b0000;
    color: white;
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
}

.atualizar:hover {
    background: #b00000;
}

.aviso {
    background: #111;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 18px;
    text-align: center;
}

.lista {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    background: white;
    border-radius: 17px;
    padding: 20px;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.3);

    border-left: 5px solid #8b0000;
}

.card.nova {
    border-left-color: #c40000;
}

.cabecalho-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.cabecalho-card h3 {
    margin: 0;
    font-size: 19px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    background: #c40000;
    color: white;
    font-size: 11px;
    font-weight: bold;
}

.info {
    display: grid;
    gap: 9px;
}

.linha {
    padding: 9px;
    background: #f2f2f2;
    border-radius: 9px;
}

.rotulo {
    display: block;
    color: #777;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 3px;
}

.valor {
    font-size: 14px;
    font-weight: bold;
}

.problema {
    margin-top: 12px;
    padding: 12px;
    background: #fff4f4;
    border-radius: 10px;
    border: 1px solid #ead0d0;
}

.problema strong {
    display: block;
    margin-bottom: 5px;
    font-size: 12px;
}

.problema p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
}

.data {
    margin-top: 12px;
    color: #777;
    font-size: 12px;
}

.vazio {
    background: white;
    border-radius: 17px;
    padding: 35px 20px;
    text-align: center;
}

.vazio .icone {
    font-size: 45px;
    margin-bottom: 10px;
}

.vazio h3 {
    margin: 5px 0;
}

.vazio p {
    color: #777;
    margin-bottom: 0;
}

.voltar {
    display: block;
    text-align: center;
    color: #ccc;
    text-decoration: none;
    margin-top: 25px;
    font-weight: bold;
}

.voltar:hover {
    color: white;
}

.erro {
    background: #ffe5e5;
    color: #900;
    border: 1px solid #d99;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
}

@media (max-width: 600px) {

    .topo {
        align-items: stretch;
        flex-direction: column;
    }

    .atualizar {
        width: 100%;
    }

    .cabecalho-card {
        align-items: flex-start;
        flex-direction: column;
    }

}

</style>

</head>

<body>


<script>

/* =========================
   PROTEÇÃO DA OFICINA
========================= */

if (
    sessionStorage.getItem("oficinaAutorizada") !== "true"
) {

    window.location.replace("login.html");

}

</script>


<header>

    <div class="logo">
        🏍️
    </div>

    <h1>
        DANIEL RB MOTOS
    </h1>

    <p>
        Solicitações dos clientes
    </p>

</header>


<div class="container">


    <div class="topo">

        <h2>
            🔔 Solicitações recebidas
        </h2>

        <button
            class="atualizar"
            onclick="carregarSolicitacoes()"
        >
            🔄 Atualizar
        </button>

    </div>


    <div
        id="aviso"
        class="aviso"
    >
        Carregando solicitações...
    </div>


    <div
        id="erro"
        class="erro"
    ></div>


    <div
        id="lista"
        class="lista"
    ></div>


    <a
        href="oficina.html"
        class="voltar"
    >
        ← Voltar para o painel da oficina
    </a>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function carregarSolicitacoes() {

    const lista =
        document.getElementById("lista");

    const aviso =
        document.getElementById("aviso");

    const erro =
        document.getElementById("erro");


    aviso.style.display = "block";
    aviso.textContent =
        "🔄 Carregando solicitações...";

    erro.style.display = "none";

    lista.innerHTML = "";


    try {

        const resposta =
            await supabaseClient
                .from("solicitacoes")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (resposta.error) {

            throw resposta.error;

        }


        const solicitacoes =
            resposta.data || [];


        aviso.style.display = "none";


        if (
            solicitacoes.length === 0
        ) {

            lista.innerHTML = `

                <div class="vazio">

                    <div class="icone">
                        📭
                    </div>

                    <h3>
                        Nenhuma solicitação
                    </h3>

                    <p>
                        Quando um cliente solicitar um serviço,
                        ele aparecerá aqui.
                    </p>

                </div>

            `;

            return;

        }


        solicitacoes.forEach(
            function(item) {

                const status =
                    String(
                        item.status || "Nova"
                    );


                const nomeCliente =
                    item.nome_cliente ||
                    item.cliente_nome ||
                    item.nome ||
                    "Cliente";


                const moto =
                    item.moto ||
                    item.moto_nome ||
                    "Não informado";


                const servico =
                    item.servico ||
                    item.servico_nome ||
                    item.tipo_servico ||
                    "Não informado";


                const problema =
                    item.problema ||
                    item.descricao ||
                    item.observacao ||
                    "Nenhuma descrição informada";


                const data =
                    item.created_at
                    ? new Date(
                        item.created_at
                    ).toLocaleString(
                        "pt-BR"
                    )
                    : "Data não informada";


                const card =
                    document.createElement("div");


                card.className =
                    "card nova";


                card.innerHTML = `

                    <div class="cabecalho-card">

                        <h3>
                            👤 ${escapar(nomeCliente)}
                        </h3>

                        <span class="status">
                            ${escapar(status)}
                        </span>

                    </div>


                    <div class="info">

                        <div class="linha">

                            <span class="rotulo">
                                🏍️ MOTO
                            </span>

                            <span class="valor">
                                ${escapar(moto)}
                            </span>

                        </div>


                        <div class="linha">

                            <span class="rotulo">
                                🔧 SERVIÇO
                            </span>

                            <span class="valor">
                                ${escapar(servico)}
                            </span>

                        </div>

                    </div>


                    <div class="problema">

                        <strong>
                            📝 PROBLEMA / DESCRIÇÃO
                        </strong>

                        <p>
                            ${escapar(problema)}
                        </p>

                    </div>


                    <div class="data">

                        📅 Recebido em:
                        ${escapar(data)}

                    </div>

                `;


                lista.appendChild(card);

            }
        );

    }

    catch (error) {

        console.error(
            "Erro ao carregar solicitações:",
            error
        );


        aviso.style.display = "none";


        erro.style.display = "block";


        erro.textContent =
            "❌ Não foi possível carregar as solicitações. " +
            "Verifique as permissões da tabela solicitacoes no Supabase.";

    }

}


function escapar(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   INICIAR
========================= */

carregarSolicitacoes();


/* Atualiza automaticamente
   a cada 5 segundos */

setInterval(
    carregarSolicitacoes,
    5000
);

</script>


</body>

</html>
