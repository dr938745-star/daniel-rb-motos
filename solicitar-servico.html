<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitar Serviço - DANIEL RB MOTOS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: white;
    min-height: 100vh;
}

header {
    background: #050505;
    border-bottom: 1px solid #222;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
    color: #aaa;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
}

.card h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

select,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 15px;
    background: #0f0f0f;
    color: white;
    outline: none;
}

select:focus,
textarea:focus {
    border-color: #d40000;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.botao {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #e00000, #870000);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.botao:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.info {
    background: #202020;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 14px;
    color: #bbb;
    line-height: 1.5;
}

.mensagem {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
}

.erro {
    background: #3a1010;
    color: #ff7777;
    border: 1px solid #6b2222;
}

.sucesso {
    background: #10351d;
    color: #65df8a;
    border: 1px solid #1f6d38;
}

.voltar {
    display: block;
    width: 100%;
    text-align: center;
    color: white;
    text-decoration: none;
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    margin-top: 20px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
}

.voltar:hover {
    background: #222;
}

.vazio {
    text-align: center;
    color: #999;
    padding: 20px;
}

footer {
    text-align: center;
    padding: 30px 20px;
    color: #777;
    font-size: 13px;
}

.instagram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 25px;
    background: #151515;
    color: white;
    text-decoration: none;
    border: 1px solid #333;
}

</style>

</head>

<body>

<header>

<h1>🔧 Solicitar Serviço</h1>

<p>DANIEL RB MOTOS</p>

</header>

<div class="container">

<div class="card">

<h2>📋 Solicitação</h2>

<div class="info">
    Escolha uma das suas motos e informe qual serviço você precisa.
    A solicitação será enviada para a oficina e a equipe entrará em contato.
</div>

<label for="moto">
Sua moto
</label>

<select id="moto">

<option value="">
⏳ Carregando suas motos...
</option>

</select>

<label for="servico">
Serviço desejado
</label>

<select id="servico">

<option value="">
Selecione o serviço
</option>

<option value="Revisão geral">
🔧 Revisão geral
</option>

<option value="Troca de óleo">
🛢️ Troca de óleo
</option>

<option value="Sistema de freios">
🛑 Sistema de freios
</option>

<option value="Motor">
⚙️ Motor
</option>

<option value="Elétrica">
⚡ Elétrica
</option>

<option value="Manutenção preventiva">
🏍️ Manutenção preventiva
</option>

<option value="Outro">
📝 Outro
</option>

</select>

<label for="descricao">
Descreva o problema ou o que você precisa
</label>

<textarea
id="descricao"
placeholder="Ex: minha moto está fazendo um barulho no motor..."
></textarea>

<button
type="button"
class="botao"
id="botaoSolicitar"
>
📨 Enviar solicitação
</button>

<div id="mensagem"></div>

</div>

<a
href="area-cliente.html"
class="voltar"
>
← Voltar para a Área do Cliente
</a>

</div>

<footer>

DANIEL RB MOTOS<br>
Oficina de motos

<br>

<a
class="instagram"
href="https://www.instagram.com/danielrbmotoss/"
target="_blank"
rel="noopener noreferrer"
>
📸 @DANIELRBMOTOSS
</a>

</footer>

<script>

const SUPABASE_URL =
"https://niffgrhjmnizvusnrqyg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MM2ahV5R6hDEq6Kdi7Zt9g_CZBE4G7B";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let clienteLogado = null;
let motosDoCliente = [];


async function iniciar() {

    try {

        const {
            data: {
                user
            },
            error: erroUsuario
        } = await supabaseClient
            .auth
            .getUser();

        if (erroUsuario) {
            throw erroUsuario;
        }

        if (!user) {

            window.location.href =
                "login-cliente.html";

            return;

        }

        const email =
            user.email
                ? user.email
                    .trim()
                    .toLowerCase()
                : "";

        if (!email) {

            mostrarErro(
                "Sua conta não possui um e-mail válido."
            );

            return;

        }

        const {
            data: cliente,
            error: erroCliente
        } = await supabaseClient
            .from("clientes_nova")
            .select("id,nome,email")
            .eq("email", email)
            .maybeSingle();

        if (erroCliente) {
            throw erroCliente;
        }

        if (!cliente) {

            mostrarErro(
                "Seu cadastro de cliente não foi encontrado."
            );

            return;

        }

        clienteLogado = cliente;

        await carregarMotos();

    }

    catch (erro) {

        console.error(
            "ERRO AO INICIAR:",
            erro
        );

        mostrarErro(
            erro.message ||
            "Não foi possível carregar a solicitação."
        );

    }

}


async function carregarMotos() {

    const select =
        document.getElementById("moto");

    select.innerHTML = `
        <option value="">
            ⏳ Carregando suas motos...
        </option>
    `;

    const {
        data: motos,
        error
    } = await supabaseClient
        .from("motos")
        .select(
            "id,marca,modelo,placa,ano"
        )
        .eq(
            "cliente_id",
            Number(clienteLogado.id)
        )
        .order(
            "id",
            {
                ascending: false
            }
        );

    if (error) {

        throw error;

    }

    motosDoCliente =
        motos || [];

    if (motosDoCliente.length === 0) {

        select.innerHTML = `
            <option value="">
                🏍️ Você ainda não possui motos cadastradas
            </option>
        `;

        return;

    }

    select.innerHTML = `
        <option value="">
            Selecione sua moto
        </option>
    `;

    motosDoCliente.forEach(
        function(moto) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                moto.id;

            option.textContent =
                `${moto.marca || ""} ${moto.modelo || ""} — ${moto.placa || "Sem placa"}`;

            select.appendChild(
                option
            );

        }
    );

}


document
.getElementById("botaoSolicitar")
.addEventListener(
    "click",
    async function() {

        const botao =
            this;

        const motoId =
            document
            .getElementById("moto")
            .value;

        const servico =
            document
            .getElementById("servico")
            .value;

        const descricao =
            document
            .getElementById("descricao")
            .value
            .trim();

        const mensagem =
            document.getElementById(
                "mensagem"
            );


        if (!clienteLogado) {

            mostrarErro(
                "Sua conta ainda não foi carregada."
            );

            return;

        }


        if (!motoId) {

            alert(
                "⚠️ Selecione sua moto."
            );

            return;

        }


        if (!servico) {

            alert(
                "⚠️ Selecione o serviço."
            );

            return;

        }


        if (!descricao) {

            alert(
                "⚠️ Descreva o problema ou o serviço desejado."
            );

            return;

        }


        botao.disabled = true;

        botao.textContent =
            "⏳ Enviando...";

        mensagem.innerHTML = "";


        try {

            /*
              IMPORTANTE:

              Esta parte grava a solicitação
              somente se a tabela "solicitacoes"
              existir no Supabase com os campos
              abaixo.

              Caso sua tabela tenha outro nome,
              vamos ajustar depois.
            */

            const {
                error
            } = await supabaseClient
                .from("solicitacoes")
                .insert({

                    cliente_id:
                        Number(
                            clienteLogado.id
                        ),

                    moto_id:
                        Number(
                            motoId
                        ),

                    servico:
                        servico,

                    descricao:
                        descricao,

                    status:
                        "Pendente"

                });


            if (error) {

                throw error;

            }


            document.getElementById(
                "moto"
            ).value = "";


            document.getElementById(
                "servico"
            ).value = "";


            document.getElementById(
                "descricao"
            ).value = "";


            mensagem.innerHTML = `
                <div class="mensagem sucesso">

                    ✅ Solicitação enviada com sucesso!

                    <br><br>

                    A oficina recebeu sua solicitação
                    e entrará em contato.

                </div>
            `;

        }

        catch (erro) {

            console.error(
                "ERRO AO ENVIAR:",
                erro
            );


            mensagem.innerHTML = `
                <div class="mensagem erro">

                    ❌ Não foi possível enviar a solicitação.

                    <br><br>

                    ${escaparHTML(
                        erro.message ||
                        "Erro desconhecido."
                    )}

                </div>
            `;

        }

        finally {

            botao.disabled = false;

            botao.textContent =
                "📨 Enviar solicitação";

        }

    }
);


function mostrarErro(texto) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    mensagem.innerHTML = `
        <div class="mensagem erro">
            ❌ ${escaparHTML(texto)}
        </div>
    `;

}


function escaparHTML(valor) {

    return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


iniciar();

</script>

</body>

</html>
